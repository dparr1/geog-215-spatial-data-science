<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2C5080">
  <title>Offline | GEOG 215</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #EDF5FB; color: #13294B; padding: 16px; box-sizing: border-box;
           font-family: "Atkinson Hyperlegible Next", "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { background: #fff; border-top: 4px solid #4B9CD3; border-radius: 8px; max-width: 30rem;
           padding: 1.5rem 1.75rem; box-shadow: 0 2px 10px rgba(19, 41, 75, 0.12); }
    h1 { font-size: 1.4rem; margin: 0 0 0.75rem; }
    p { line-height: 1.5; }
    button { background: #2C5080; color: #fff; border: 0; border-radius: 6px; padding: 0.6rem 1.1rem;
             font: inherit; cursor: pointer; }
    a { color: #007FAE; }
  </style>
</head>
<body>
  <main>
    <h1>You're offline</h1>
    <p>This page hasn't been saved on this device yet. Pages you've opened before
      still work offline, but quizzes, polls, questions, and running code need
      the internet.</p>
    <p><button type="button" onclick="location.reload()">Try again</button>
      &nbsp; <a href="/">Go to the home page</a></p>
  </main>
</body>
</html>

name: Render and Publish Quarto Book

# Every push to main renders the book and commits it to dparr1/daveparr.com
# under geog215/, which triggers Cloudflare's build of daveparr.com
# (https://daveparr.com/geog215/).
#
# Only HTML is rendered: the PDF format needs R even when results are frozen,
# and R is not installed on the runner. Code results come from _freeze/.

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-book
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out book
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render book
        run: quarto render --to html

      - name: Check out daveparr.com
        uses: actions/checkout@v4
        with:
          repository: dparr1/daveparr.com
          ref: main
          path: daveparr.com
          # Deploy key with write access to daveparr.com (repo Settings >
          # Deploy keys); its private half is this repo's secret.
          ssh-key: ${{ secrets.DAVEPARR_DEPLOY_KEY }}

      - name: Copy book into daveparr.com/geog215
        run: |
          rsync -a --delete _book/ daveparr.com/geog215/
          cd daveparr.com
          git add -A geog215
          if git diff --cached --quiet; then
            echo "Book unchanged on daveparr.com; nothing to push."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update GEOG 215 book from ${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
          git push origin HEAD:main

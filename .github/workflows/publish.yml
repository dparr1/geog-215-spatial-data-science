name: Render and Publish Quarto Book

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write   # lets the Netlify action post the deploy to GitHub
  statuses: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      # Optional: Uncomment if your book executes Python or R code
      # - name: Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.10'
      # - run: pip install -r requirements.txt

      # HTML only: Netlify serves the HTML book, and the PDF format needs R
      # even when results are frozen (R is not installed on the runner).
      - name: Render Quarto Book
        uses: quarto-dev/quarto-actions/render@v2
        with:
          to: html

      - name: Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: './_book'
          production-branch: main
          github-token: ${{ secrets.GITHUB_TOKEN }}
          deploy-message: "Deploy from GitHub Actions"
          enable-pull-request-comment: false
          enable-commit-comment: false
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
# Glossary of key terms for the book.
#
# This one file drives two things:
#   1. Hover/tap definitions in the chapters. The glossary filter
#      (filters/glossary/glossary.lua) finds each term in the chapter text and
#      turns it into a dotted-underlined word that shows its definition when
#      hovered, tapped, or focused with the keyboard. To keep pages readable,
#      only the FIRST use of a term in each section (each ## heading) is marked.
#   2. The Glossary page at the back of the book (glossary.qmd), which lists
#      every term alphabetically.
#
# Each entry has:
#   term:            The name shown in the popup and on the Glossary page. It is
#                    also matched in the text (case doesn't matter).
#   aliases:         (optional) Other spellings to match: plurals, abbreviations,
#                    other forms of the word.
#   definition:      One or two plain sentences. Markdown (*italic*, `code`) works.
#   case_sensitive:  (optional) true to match only the exact capitalization, for
#                    words that are also ordinary English (Console, Editor).
#   chapters:        (optional) Limit matching to these chapter files (file name
#                    without .qmd), for words that mean different things in
#                    different chapters ("block" of code vs. census "block").
#
# Matching is on whole words, and the longest match wins, so "block group" is
# never marked as "block", and "R Markdown" is never marked as "Markdown".

# Phrases that look like a term but aren't one. They are matched (so the
# shorter term inside them is not) and left unmarked.
exclude:
  - scale up
  - joined with
  - Geography and Environment
  - Environment, Ecology
  - massive scale
  - code at scale
  - Environment and Public Health
  - Join a professional
  - programs and courses

terms:

  # --- Chapter-specific meanings ----------------------------------------------
  # When two entries match the same word, the one listed first wins. These
  # entries give a word a different meaning in a few chapters, so they come
  # before the general entries for the same word further down
  # ("vector" in R vs. vector data; "scale" in a plot vs. scale of analysis).

  - term: vector data model
    aliases: [vector, vectors, vector model]
    chapters: [geographic-information]
    definition: >-
      Storing geographic features as coordinates: points, lines (chains of
      vertices), and polygons, each with a row of attributes. It suits
      discrete objects with clear edges, such as roads and parcels.

  - term: scale (in a plot or map)
    aliases: [scale, scales]
    chapters: [tidyverse-ggplot, thematic-maps-tmap]
    definition: >-
      The rules that turn data values into visual values: which colors,
      which classes, which axis breaks. Every mapped aesthetic has one, and
      functions such as `scale_fill_manual()` or `tm_scale_intervals()`
      change it.

  - term: block (of code)
    aliases: [block, blocks]
    chapters: [blocks-loops-functions]
    definition: >-
      Lines of code inside curly braces, `{ }`, that R runs as one unit.
      `if` statements, loops, and functions each control a block.

  - term: neighborhood (in spatial analysis)
    aliases: [neighborhood, neighborhoods]
    chapters: [distance-neighborhoods, spatial-autocorrelation]
    definition: >-
      The zone of influence around a feature. Features inside it are its
      neighbors, defined by a distance, the nearest features, or shared
      borders.

  # --- What is Spatial Data Science? -----------------------------------------

  - term: spatial data science
    definition: >-
      The use of data that have a location attached to answer questions about
      the world. It combines what we study (the *spatial*), how we handle it
      (*data* skills), and how we ask and answer questions (*science*).

  - term: spatial thinking
    definition: >-
      Taking seriously how location connects observations: asking whether
      nearby values are alike, whether a pattern depends on the size of the
      areas, and whether a relationship holds everywhere.

  - term: independence
    aliases: [independent]
    definition: >-
      The assumption, built into most standard statistics, that knowing one
      observation tells you nothing about another. Data about places usually
      break it, because nearby places tend to be alike.

  - term: spatial autocorrelation
    definition: >-
      The tendency for things that are close together to be more alike than
      things that are far apart, such as neighboring counties having similar
      incomes.

  - term: first law of geography
    aliases: [Tobler's first law, Tobler's first law of geography]
    definition: >-
      Waldo Tobler's statement that "everything is related to everything else,
      but near things are more related than distant things." It is the idea
      behind spatial autocorrelation.

  - term: hotspot
    aliases: [hotspots, hot spot, hot spots, hot-spot]
    definition: >-
      A cluster of places with unusually high values, such as a group of
      neighborhoods with many burglaries. Finding hotspots is a common goal of
      spatial analysis.

  - term: scale
    definition: >-
      The level of detail at which you study something: addresses,
      neighborhoods, counties, or states. A pattern that is clear at one scale
      can vanish or reverse at another.

  - term: modifiable areal unit problem (MAUP)
    aliases: [modifiable areal unit problem, MAUP]
    definition: >-
      The way results can change when the same individual data are grouped
      into different areas, either larger or smaller ones or the same size
      with different boundaries.

  - term: spatial heterogeneity
    definition: >-
      The idea that relationships between variables change from place to
      place. A link that is strong in one city may be weak, or reversed, in
      another.

  - term: vector data
    aliases: [spatial vector data]
    definition: >-
      Spatial data stored as points, lines, and polygons, each with a table of
      attributes. In R, the **sf** package handles vector data.

  - term: raster
    aliases: [rasters, raster data]
    definition: >-
      Spatial data stored as a grid of cells (pixels), each holding a value,
      such as a satellite image or an elevation model. In R, the **terra**
      package handles rasters.

  - term: polygon
    aliases: [polygons]
    definition: >-
      A closed shape that represents an area, such as a county, a lake, or a
      census tract.

  - term: coordinate system
    aliases: [coordinate systems, coordinate reference system, CRS]
    definition: >-
      The rules that tie coordinates to places on the Earth, including how
      the round Earth is flattened onto a map (the projection). Layers must
      share a coordinate system before you can combine them.

  - term: clustering
    aliases: [cluster detection, cluster analysis]
    definition: >-
      Methods that find groups of similar observations, or groups of places
      with similar values that sit close together.

  - term: ANOVA
    case_sensitive: true
    definition: >-
      Analysis of variance: a statistical test of whether the averages of
      three or more groups differ, such as median age in three regions. It
      compares variation between groups with variation within them.

  - term: regression
    definition: >-
      A statistical model of how one variable (such as home price) changes
      with one or more others (such as distance to downtown).

  - term: network analysis
    definition: >-
      Analysis of movement along a network, such as roads, to measure travel
      distance or time, or how easily people can reach a place.

  # --- R packages -----------------------------------------------------------

  - term: tidyverse
    definition: >-
      A family of R packages (including **dplyr**, **ggplot2**, and **readr**)
      for reading, cleaning, reshaping, summarizing, and plotting data, all
      designed to work together.

  - term: sf
    case_sensitive: true
    definition: >-
      "Simple features": the R package for spatial vector data. An sf object
      is a data frame with a geometry column holding each row's point, line,
      or polygon.

  - term: tmap
    case_sensitive: true
    definition: >-
      An R package for making thematic maps quickly, with sensible defaults.

  - term: terra
    case_sensitive: true
    definition: >-
      An R package for working with raster data.

  - term: ggplot2
    case_sensitive: true
    definition: >-
      The tidyverse package for making plots and maps by adding layers.

  - term: dplyr
    case_sensitive: true
    definition: >-
      The tidyverse package for transforming data frames: filtering rows,
      choosing columns, adding new columns, joining tables, and summarizing.

  - term: purrr
    case_sensitive: true
    definition: >-
      The tidyverse package for repeating a task over many inputs, such as
      downloading data for several years.

  - term: tidycensus
    case_sensitive: true
    definition: >-
      An R package that downloads US Census data through the Census API and
      returns it as a tidy data frame, with boundaries attached if you ask.

  - term: tigris
    case_sensitive: true
    definition: >-
      An R package that downloads Census boundary files (TIGER/Line
      shapefiles) as sf objects.

  - term: httr2
    case_sensitive: true
    definition: >-
      An R package for building, sending, and reading web (HTTP) requests,
      used to call an API by hand.

  # --- R, RStudio, and R Markdown -------------------------------------------

  - term: RStudio
    case_sensitive: true
    definition: >-
      The integrated development environment (IDE) where you write and run R.
      R does the computing; RStudio is the workspace around it.

  - term: integrated development environment (IDE)
    aliases: [integrated development environment, IDE]
    definition: >-
      A program that puts everything for writing code in one window: an
      editor, a place to run the code, and tools to inspect the results.

  - term: package
    aliases: [packages, R package, R packages]
    definition: >-
      A bundle of code, written by other users, that adds new functions to R.
      Install it once with `install.packages()`, then load it in each session
      with `library()`.

  - term: CRAN
    case_sensitive: true
    definition: >-
      The Comprehensive R Archive Network: the official website for
      downloading R and most R packages.

  - term: Editor
    case_sensitive: true
    definition: >-
      The RStudio pane (top left) where you write and save scripts and R
      Markdown files. Code here can be kept and run again.

  - term: Console
    case_sensitive: true
    definition: >-
      The RStudio pane (bottom left) where R runs commands and prints results,
      warnings, and errors. Nothing typed here is saved.

  - term: Environment
    case_sensitive: true
    definition: >-
      The RStudio pane (top right) that lists the variables and data currently
      in memory.

  - term: R script
    aliases: [R scripts, script, scripts]
    definition: >-
      A plain file of R code, ending in `.R`. Anything that isn't code must be
      written as a comment.

  - term: R Markdown
    definition: >-
      A document format (`.Rmd`) that mixes formatted text with chunks of R
      code. Knitting it runs the code and builds a finished report.

  - term: Markdown
    case_sensitive: true
    definition: >-
      A simple way of formatting plain text: `#` for headings, `*italic*`,
      `**bold**`, and `-` for list items.

  - term: Quarto
    case_sensitive: true
    definition: >-
      The newer successor to R Markdown, from the same developers. Quarto
      files end in `.qmd`. This book is written in Quarto.

  - term: YAML header
    aliases: [YAML]
    definition: >-
      The block at the top of an R Markdown file, between two lines of three
      dashes, that holds the document's title, author, date, and output
      format.

  - term: metadata
    definition: >-
      Data about data: who made a dataset, when, how, and what each part
      means. In a YAML header, it describes the document.

  - term: code chunk
    aliases: [code chunks, chunk, chunks]
    definition: >-
      A block of R code inside an R Markdown file, starting with
      ```` ```{r} ```` and ending with three backticks.

  - term: knit
    aliases: [knitting, knits, knitted]
    definition: >-
      To build an R Markdown file into a finished document (HTML, PDF, or
      Word). Knitting reruns every code chunk from the top in a fresh R
      session.

  - term: reproducibility
    aliases: [reproducible]
    definition: >-
      The ability for anyone to rerun an analysis from its code and data and
      get the same result.

  - term: file path
    aliases: [file paths]
    definition: >-
      The location of a file on your computer, such as `data/counties.csv`.
      When you knit, paths are read relative to the folder the `.Rmd` file is
      saved in.

  - term: block of code
    aliases: [block, blocks]
    chapters: [r-rstudio-rmarkdown]
    definition: >-
      Several lines of code that work together on one task, like the steps of
      one recipe. In R Markdown, a block usually lives in one code chunk.

  - term: program
    aliases: [programs]
    definition: >-
      A set of lines and blocks of code that work together to do a whole job.
      R runs a program from top to bottom, so order matters.

  - term: variable
    aliases: [variables]
    definition: >-
      In R, a named piece of memory that holds data, such as `months <- 12`.
      In a dataset, a measured characteristic, such as median income; each
      Census variable has a code.

  - term: assignment operator
    definition: >-
      `<-`, the arrow that stores the value on its right in the name on its
      left. Read `x <- 5` as "x gets 5."

  - term: case-sensitive
    definition: >-
      Treating capital and lowercase letters as different. In R, `Months` and
      `months` are two different names.

  - term: comment
    aliases: [comments]
    definition: >-
      A note for people that R ignores. In R, a comment starts with `#`.

  - term: function
    aliases: [functions]
    definition: >-
      Code that takes inputs (arguments), does a job, and returns an output,
      such as `mean(temps)`.

  - term: argument
    aliases: [arguments]
    definition: >-
      An input to a function, written inside its parentheses.

  - term: named argument
    aliases: [named arguments]
    definition: >-
      An argument given with its name, such as `digits = 1` in
      `round(x, digits = 1)`.

  - term: vector
    aliases: [vectors]
    definition: >-
      A sequence of values that R stores together, made with `c()`, such as
      `c(71, 75, 68)`.

  - term: pipe
    aliases: [pipe operator]
    definition: >-
      The operator `|>`, which passes the result on its left as the first
      argument of the function on its right. Read it as "and then."

  - term: syntax
    definition: >-
      The exact rules for writing code: spelling, capitalization, commas,
      quotation marks, and matching brackets.

  - term: data frame
    aliases: [data frames, tibble, tibbles]
    definition: >-
      R's table: rows are observations and columns are variables. A tibble is
      the tidyverse's version of a data frame.

  # --- R Basics -------------------------------------------------------------

  - term: interpreted language
    aliases: [interpreter, interpreters, interpreted]
    definition: >-
      A language, like R, that runs code one line at a time: an interpreter
      reads each line, translates it, and runs it before moving on.

  - term: compiler
    aliases: [compilers, compiled, compile]
    definition: >-
      A program that translates a whole program into machine code before any
      of it runs. C and Java are compiled; R is interpreted.

  - term: R session
    aliases: [R sessions, fresh session, fresh R session]
    definition: >-
      One run of R, from start to finish. A new session starts with an empty
      Environment and no packages loaded; knitting always starts a fresh one.

  - term: library
    aliases: [libraries]
    chapters: [r-basics]
    definition: >-
      The folder on your computer where installed packages are stored. You
      install packages into a library, then load them with `library()`.

  - term: data type
    aliases: [data types, atomic data type, atomic data types, atomic type, atomic types]
    definition: >-
      The kind of value R is storing. The four main atomic types are logical,
      integer, numeric, and character; `class()` tells you which you have.

  - term: logical
    case_sensitive: true
    chapters: [r-basics]
    definition: >-
      The data type for `TRUE` and `FALSE` values, written in capitals with no
      quotation marks.

  - term: integer
    aliases: [integers]
    chapters: [r-basics, tidyverse-filter-pipe]
    definition: >-
      The data type for whole numbers. R stores a typed number as numeric
      unless you add an `L`, as in `21L`. Shown as `<int>` by `glimpse()`.

  - term: numeric
    aliases: [double, doubles]
    chapters: [r-basics, tidyverse-filter-pipe]
    definition: >-
      The data type for numbers that can have a decimal part, such as 103.21.
      Also called *double*, and shown as `<dbl>` by `glimpse()`.

  - term: character
    aliases: [string, strings]
    case_sensitive: true
    chapters: [r-basics, tidyverse-filter-pipe]
    definition: >-
      The data type for text, also called strings. Character values always go
      inside quotation marks, as in `"Chapel Hill"`.

  - term: coercion
    aliases: [coerce, coerces, coerced]
    definition: >-
      R converting values from one data type to another. Mixing types in one
      vector coerces them all to the type that can hold everything, usually
      character.

  - term: camelCase
    case_sensitive: true
    definition: >-
      A way of naming variables that joins words and capitalizes every word
      after the first, as in `popChapelHill`.

  - term: snake_case
    case_sensitive: true
    definition: >-
      A way of naming variables with lowercase words joined by underscores,
      as in `pop_chapel_hill`. The tidyverse style guide uses it.

  - term: debugging
    aliases: [debug, bug, bugs]
    definition: >-
      Finding and fixing the mistakes (bugs) in code: read the error message,
      find the line, make a guess, and test it.

  - term: help page
    aliases: [help pages]
    definition: >-
      A function's documentation, opened with `?name` or `help(name)`. Every
      help page has a Description, Usage, Arguments, and Examples.

  # --- Indexing Vectors and Data Frames -------------------------------------

  - term: indexing
    aliases: [index, indexes, indices, indexed]
    chapters: [r-basics, indexing-vectors-data-frames, tidyverse-filter-pipe]
    definition: >-
      Selecting part of a vector or data frame with square brackets: by
      position (`vect[3]`), by a condition (`vect[vect > 10]`), or by name
      (`vect["Fozzie"]`).

  - term: negative index
    definition: >-
      An index with a minus sign, such as `vect[-3]`, which drops that
      position and returns the rest.

  - term: colon operator
    definition: >-
      `:`, which makes a sequence of whole numbers: `6:8` is `c(6, 7, 8)`.

  - term: comparison operator
    aliases: [comparison operators]
    definition: >-
      An operator that compares two values and returns `TRUE` or `FALSE`:
      `>`, `<`, `>=`, `<=`, `==` (equal to), and `!=` (not equal to).

  - term: logical operator
    aliases: [logical operators]
    definition: >-
      An operator that combines `TRUE` and `FALSE` values: `&` (AND, both
      must be true), `|` (OR, either can be true), and `!` (NOT).

  - term: Boolean
    case_sensitive: true
    definition: >-
      Another name for logical (`TRUE` or `FALSE`) values, after the
      mathematician George Boole.

  - term: logical vector
    aliases: [logical vectors]
    definition: >-
      A vector of `TRUE` and `FALSE` values, such as the result of
      `vect > 10`. Inside square brackets it keeps the `TRUE` positions.

  - term: truth table
    aliases: [truth tables]
    definition: >-
      A table listing the result of a logical operator for every combination
      of `TRUE` and `FALSE` inputs.

  - term: recycling
    aliases: [recycle, recycles, recycled]
    definition: >-
      R repeating a shorter vector until it matches the length of a longer
      one, so `vect[c(TRUE, FALSE)]` keeps every other element.

  - term: observation
    aliases: [observations]
    definition: >-
      One thing that was measured or recorded, such as a student, a county,
      or a flight. In a data frame, each row is an observation.

  - term: CSV
    aliases: [CSV file, CSV files, comma-separated values]
    case_sensitive: true
    definition: >-
      A plain-text table in which each line is a row and commas separate the
      values. Read one into R with `read.csv()` or `read_csv()`.

  - term: header
    chapters: [indexing-vectors-data-frames]
    definition: >-
      The first line of a data file, when it holds the column names.

  - term: delimiter
    aliases: [delimiters, separator]
    definition: >-
      The character that separates values in a text file of data, such as a
      comma in a CSV file or a tab.

  # --- Into the Tidyverse ----------------------------------------------------

  - term: data science workflow
    definition: >-
      The steps of a data analysis: import, tidy, then a loop of transform,
      visualize, and model, and finally communicate.

  - term: tidy data
    aliases: [tidy, tidying]
    chapters: [tidyverse-filter-pipe, tidyverse-arrange-select-mutate, tidyverse-summarize-group-by, tidyverse-ggplot, thematic-maps-tmap]
    definition: >-
      Data arranged so that each variable is a column, each observation is a
      row, and each value has its own cell.

  - term: nycflights13
    case_sensitive: true
    definition: >-
      An R package of data on every flight that left New York City's three
      airports in 2013, including the `flights` data frame.

  - term: masking
    aliases: [masks, mask, masked]
    definition: >-
      When two loaded packages have a function with the same name, the one
      loaded later hides (masks) the other. Reach the hidden one with
      `package::function()`.

  - term: verb
    aliases: [verbs]
    chapters: [tidyverse-filter-pipe, tidyverse-arrange-select-mutate, tidyverse-summarize-group-by]
    definition: >-
      A dplyr function named for the job it does to a data frame, such as
      `filter()`, `select()`, `arrange()`, and `mutate()`.

  - term: cheatsheet
    aliases: [cheatsheets]
    definition: >-
      A one-page summary of a package or tool. Posit publishes them for
      dplyr, ggplot2, RStudio, and more.

  - term: missing value
    aliases: [missing values, NA, NAs]
    case_sensitive: true
    definition: >-
      A value that is unknown, written `NA` ("not available") in R. Most
      calculations with `NA` give `NA`; test for it with `is.na()`.

  # --- Into the Tidyverse: arrange, distinct, select, and mutate -------------

  - term: unique value
    aliases: [unique values]
    definition: >-
      A value counted once, however many times it repeats. `distinct()` keeps
      one row for each unique value, or each unique combination of values.

  - term: ascending order
    aliases: [ascending]
    definition: >-
      Smallest to largest for numbers, A to Z for text. `arrange()` sorts in
      ascending order unless you wrap the column in `desc()`.

  - term: descending order
    aliases: [descending]
    definition: >-
      Largest to smallest for numbers, Z to A for text. Ask `arrange()` for it
      with `desc()`, as in `arrange(desc(dep_delay))`.

  - term: tie
    aliases: [ties]
    chapters: [tidyverse-arrange-select-mutate]
    definition: >-
      Two or more rows with the same value in the column being sorted.
      `arrange()` breaks ties with the next column you name.

  - term: selection helper
    aliases: [selection helpers]
    definition: >-
      A function that picks columns by name inside `select()`, such as
      `starts_with()`, `ends_with()`, and `contains()`.

  - term: vectorized
    aliases: [vectorised]
    definition: >-
      Done to every element of a vector at once, without a loop. Arithmetic in
      R is vectorized, so `distance / air_time` divides row by row.

  - term: outlier
    aliases: [outliers]
    definition: >-
      A value far from all the others. It may be real or an error, so check
      it before you report it.

  # --- Into the Tidyverse: summarize, group_by, and drop_na ------------------

  - term: summary statistic
    aliases: [summary statistics]
    definition: >-
      One number that describes many values, such as their mean, median,
      maximum, or count. `summarize()` calculates them.

  - term: mean
    case_sensitive: true
    chapters: [tidyverse-summarize-group-by, esda, spatial-statistics]
    definition: >-
      The average: the sum of the values divided by how many there are. A few
      very large or small values can pull it a long way.

  - term: standard deviation
    aliases: [standard deviations]
    definition: >-
      A measure of how spread out values are around their mean, in the same
      units as the values. `sd()` in R.

  - term: variance
    definition: >-
      A measure of spread: the standard deviation squared, so its units are
      squared too. `var()` in R.

  - term: percentile
    aliases: [percentiles, quantile, quantiles]
    definition: >-
      The value below which a given share of the values fall: a quarter of
      values are below the 25th percentile. `quantile()` in R.

  - term: skewed
    aliases: [skew, skewness]
    definition: >-
      Lopsided: most values are bunched at one end, with a long tail of
      unusual values at the other, which pulls the mean away from the median.

  - term: grouped data frame
    aliases: [grouped data frames]
    definition: >-
      A data frame made by `group_by()`. It looks the same, but later verbs
      work on each group separately until you call `ungroup()`.

  - term: weighted average
    aliases: [weighted averages, weighted mean]
    definition: >-
      An average in which some values count more than others. Total distance
      divided by total air time weights each flight's speed by its air time.

  # --- Census Data and APIs --------------------------------------------------

  - term: decennial census
    aliases: [decennial]
    definition: >-
      The full count of everyone in the US, every ten years. It asks only a
      few questions but covers every person.

  - term: apportionment
    aliases: [apportioned]
    definition: >-
      Dividing the seats in the House of Representatives among the states by
      population, the reason the Constitution requires a census.

  - term: American Community Survey (ACS)
    aliases: [American Community Survey, ACS]
    definition: >-
      The Census Bureau's continuous survey of a sample of households every
      year. It asks many more questions than the decennial census, but every
      value is an estimate with a margin of error.

  - term: sample
    aliases: [samples, sampling, sample survey]
    definition: >-
      A subset of a population that is surveyed to estimate something about
      the whole population. Smaller samples give less certain estimates.

  - term: TIGER
    case_sensitive: true
    aliases: [TIGER/Line]
    definition: >-
      The Census Bureau's national digital map database of streets and
      boundaries, first used for the 1990 census. Census boundary files come
      from it.

  - term: mean center of population
    aliases: [center of population]
    definition: >-
      The point where a flat map of the country would balance if every
      resident weighed the same.

  - term: nesting
    aliases: [nest, nests, nested]
    chapters: [census-data-apis]
    definition: >-
      When every smaller area lies entirely inside exactly one larger area, as
      blocks do inside block groups, tracts, and counties. Nested areas can be
      added up without double-counting anyone.

  - term: census block
    aliases: [census blocks, block, blocks]
    chapters: [census-data-apis]
    definition: >-
      The smallest Census geography, often a single city block bounded by
      streets or other visible features. Only decennial census data are
      published for blocks.

  - term: block group
    aliases: [block groups, census block group, census block groups]
    definition: >-
      A group of census blocks, usually holding 600 to 3,000 people. It is the
      smallest geography with ACS 5-year estimates.

  - term: census tract
    aliases: [census tracts, tract, tracts]
    definition: >-
      A small area of about 1,200 to 8,000 people (4,000 on average), drawn to
      be fairly stable over time. The workhorse unit for neighborhood
      analysis.

  - term: ZIP Code Tabulation Area (ZCTA)
    aliases: [ZIP Code Tabulation Area, ZIP Code Tabulation Areas, ZCTA, ZCTAs]
    definition: >-
      The Census Bureau's approximation of a ZIP code's area, built from
      census blocks. ZCTAs do not nest inside counties or tracts.

  - term: GEOID
    case_sensitive: true
    aliases: [GEOIDs]
    definition: >-
      The unique ID of a Census area, made by stringing together the FIPS
      codes of each level, such as `37135` for Orange County, NC. Keep GEOIDs
      as text, and join tables on them.

  - term: FIPS code
    aliases: [FIPS codes, FIPS]
    definition: >-
      A standard numeric code for a state or county (Federal Information
      Processing Standards). North Carolina is `37`.

  - term: differential privacy
    definition: >-
      Carefully calibrated random noise added to published 2020 census tables
      to protect respondents' privacy. It matters most for small areas such as
      blocks.

  - term: redistricting data (PL 94-171)
    aliases: [redistricting data, PL 94-171, redistricting counts]
    definition: >-
      The first 2020 census product: basic population, race, voting-age, and
      housing counts down to the block, used to redraw voting districts.

  - term: Demographic and Housing Characteristics (DHC)
    aliases: [Demographic and Housing Characteristics, DHC]
    definition: >-
      The 2020 census product with more detailed tables on age, sex,
      households, and housing than the redistricting data.

  - term: 5-year estimates
    aliases: [ACS 5-year estimates, ACS 5-year estimate, ACS 5-year, 5-year estimate, 5-year]
    definition: >-
      ACS estimates that pool 60 months of responses. They are the most
      reliable ACS product and the only one for tracts and block groups. An
      estimate labeled 2022 describes 2018 to 2022.

  - term: 1-year estimates
    aliases: [ACS 1-year estimates, ACS 1-year estimate, ACS 1-year, 1-year estimate, 1-year]
    definition: >-
      ACS estimates from 12 months of responses. They are the most current but
      are only published for areas of 65,000 people or more.

  - term: margin of error (MOE)
    aliases: [margin of error, margins of error, MOE, MOEs]
    definition: >-
      How far a sample estimate might be from the true value. ACS margins of
      error use a 90% confidence level: there is a 90% chance the true value
      lies within the estimate plus or minus the MOE.

  - term: confidence level
    definition: >-
      How sure you can be that the true value lies within a range. The ACS
      uses a 90% confidence level for its margins of error.

  - term: standard error
    definition: >-
      A measure of how much a sample estimate would vary from sample to
      sample. For the ACS, it is the margin of error divided by 1.645.

  - term: coefficient of variation (CV)
    aliases: [coefficient of variation, CV]
    definition: >-
      The standard error as a percentage of the estimate. A CV above about
      30% is a common sign that an estimate is unreliable.

  - term: median
    aliases: [medians]
    definition: >-
      The middle value when values are sorted, so half are above and half
      below. Unlike counts, medians can't be added across areas.

  - term: denominator
    aliases: [denominators]
    definition: >-
      The number you divide by to turn a count into a share, usually the total
      of the same table, such as total population.

  - term: nominal dollars
    aliases: [nominal]
    definition: >-
      Dollar amounts as reported in their own year, not adjusted for
      inflation. Adjust them before comparing across years.

  - term: microdata
    definition: >-
      Records for individual people or households (with identifying details
      removed), rather than totals for areas. The ACS publishes microdata as
      PUMS.

  - term: API
    case_sensitive: true
    aliases: [APIs, Application Programming Interface]
    definition: >-
      Application Programming Interface: a set of rules for how one program
      asks another for data or services, such as your R script asking the
      Census Bureau's server for a table.

  - term: API key
    aliases: [API keys]
    definition: >-
      A private code that identifies you to an API. Store it in `.Renviron`,
      never in a script you share.

  - term: REST
    case_sensitive: true
    definition: >-
      The most common style of web API: each dataset has its own URL, you ask
      for data with ordinary web requests, and the answer usually comes back
      as JSON.

  - term: endpoint
    aliases: [endpoints]
    definition: >-
      The web address of one dataset or service in an API, such as
      `https://api.census.gov/data/2022/acs/acs5`.

  - term: parameter
    aliases: [parameters]
    chapters: [census-data-apis]
    definition: >-
      A `name=value` setting added to an API request after the `?`, such as
      `for=county:*`, that says what you want.

  - term: HTTP
    case_sensitive: true
    definition: >-
      The protocol web browsers and servers use to talk. A `GET` request reads
      data; a `POST` request sends data.

  - term: JSON
    case_sensitive: true
    definition: >-
      JavaScript Object Notation: structured text that most web APIs send
      back, which R can turn into lists or data frames.

  - term: geocoding
    definition: >-
      Turning an address or place name into coordinates that can be mapped.

  - term: wrapper package
    aliases: [wrapper packages]
    definition: >-
      An R package that hides the details of calling an API behind simple
      functions, such as **tidycensus** for the Census API.

  - term: join
    aliases: [joins, joined, joining]
    definition: >-
      Combining two tables by matching rows on a shared key column, such as
      attaching Census data to boundaries by `GEOID` with `left_join()`.

  - term: Jenks natural breaks
    aliases: [natural breaks, Jenks]
    definition: >-
      A way of dividing values into map classes that puts the breaks where
      the gaps between values are largest, so similar values share a color.

  # --- Into the Tidyverse: Graphs with ggplot2 -------------------------------

  - term: grammar of graphics
    definition: >-
      The idea that any chart can be described with the same small set
      of parts: data, aesthetic mappings, geoms, scales, facets, and
      coordinates. ggplot2 is built on it.

  - term: aesthetic
    aliases: [aesthetics, aes]
    chapters: [tidyverse-ggplot]
    definition: >-
      A visual property of a mark, such as its x position, y position,
      color, fill, size, or shape. In ggplot2, `aes()` connects columns
      to aesthetics.

  - term: mapping an aesthetic
    aliases: [mapping, mappings, mapped]
    chapters: [tidyverse-ggplot]
    definition: >-
      Tying an aesthetic to a column, inside `aes()`, as in `aes(color =
      origin)`. The look of each mark then comes from the data, and
      ggplot2 adds a legend.

  - term: setting an aesthetic
    aliases: [setting]
    chapters: [tidyverse-ggplot, thematic-maps-tmap]
    definition: >-
      Giving every mark the same fixed value, outside `aes()`, as in
      `geom_point(color = "blue")`. It is a design choice, not a data
      choice.

  - term: geom
    aliases: [geoms]
    chapters: [tidyverse-ggplot]
    definition: >-
      Short for geometric object: the marks a ggplot draws to show the
      data, such as points (`geom_point()`), bars (`geom_bar()`), or
      boxes (`geom_boxplot()`).

  - term: layer
    aliases: [layers]
    chapters: [tidyverse-ggplot, thematic-maps-tmap, geographic-information, arcpullr]
    definition: >-
      One piece of a plot or map, added with `+` and drawn on top of the
      layers before it. In GIS, a layer holds one theme of features,
      such as roads or soils.

  - term: scatterplot
    aliases: [scatterplots, scatter plot]
    chapters: [tidyverse-ggplot]
    definition: >-
      A plot of two continuous variables against each other, with one
      point per observation. In ggplot2, `geom_point()`.

  - term: confidence interval
    aliases: [confidence band, confidence intervals]
    chapters: [tidyverse-ggplot, anova, regression]
    definition: >-
      A range that is likely to contain the true value of something
      estimated from data. `geom_smooth()` shades a 95% confidence
      interval around its trend line.

  - term: legend
    aliases: [legends]
    chapters: [tidyverse-ggplot, thematic-maps-tmap]
    definition: >-
      The key that explains what the colors, sizes, or shapes on a plot
      or map mean. ggplot2 and tmap build one for every mapped
      aesthetic.

  - term: hex code
    aliases: [hex codes]
    chapters: [tidyverse-ggplot]
    definition: >-
      A six-character code for a color, such as `#3182bd`: two
      characters each for its red, green, and blue.

  - term: bar chart
    aliases: [bar charts]
    chapters: [tidyverse-ggplot]
    definition: >-
      A chart that compares counts or amounts across categories with
      bars. `geom_bar()` counts rows for you; `geom_col()` draws heights
      you give it.

  - term: stacked bar chart
    aliases: [stacked bar charts, stacked bars]
    chapters: [tidyverse-ggplot]
    definition: >-
      A bar chart where each bar is split into colored segments, one per
      group, so the bar's height is the total.

  - term: boxplot
    aliases: [boxplots, box plot, box plots]
    chapters: [tidyverse-ggplot, esda]
    definition: >-
      A chart that summarizes a distribution: the box spans the middle
      half of the values, a line marks the median, and dots beyond the
      whiskers are outliers.

  - term: small multiples
    aliases: [facet, facets, faceting]
    chapters: [tidyverse-ggplot]
    definition: >-
      A set of small charts, one per group, that share the same axes so
      they can be compared directly. ggplot2 calls this faceting.

  - term: theme
    aliases: [themes]
    chapters: [tidyverse-ggplot]
    definition: >-
      The settings for everything on a plot that isn't data: background,
      grid lines, fonts. Add one with a layer such as `theme_minimal()`.

  - term: dpi
    aliases: [dots per inch]
    chapters: [tidyverse-ggplot]
    definition: >-
      Dots per inch: the resolution of a saved image. 300 dpi is print
      quality.

  # --- Thematic Maps with tmap ------------------------------------------------

  - term: thematic map
    aliases: [thematic maps]
    chapters: [thematic-maps-tmap, geographic-information]
    definition: >-
      A map that shows how one theme, such as income, tree height, or
      building age, varies from place to place.

  - term: feature
    aliases: [features]
    chapters: [thematic-maps-tmap, geographic-information, arcpullr, distance-neighborhoods]
    definition: >-
      One spatial object in a layer of data, such as one tree, one
      sidewalk segment, or one building. In an sf object, each row is a
      feature.

  - term: attribute
    aliases: [attributes, attribute table, attribute tables, attribute data]
    chapters: [thematic-maps-tmap, geographic-information]
    definition: >-
      A non-spatial fact about a spatial feature, such as a tree's
      species or a building's year built. Attributes are the columns of
      a layer's attribute table.

  - term: geometry column
    aliases: [geometry columns]
    chapters: [thematic-maps-tmap, geographic-information]
    definition: >-
      The column of an sf object that holds each feature's shape: a
      point, a line, or a polygon.

  - term: sequential palette
    aliases: [sequential palettes]
    chapters: [thematic-maps-tmap]
    definition: >-
      Colors that run from light to dark, used for numbers so that
      bigger values look darker.

  - term: qualitative palette
    aliases: [qualitative palettes]
    chapters: [thematic-maps-tmap]
    definition: >-
      Distinct colors with no order, one per category, used for text
      columns such as species names.

  - term: classification
    aliases: [class, classes]
    chapters: [thematic-maps-tmap]
    definition: >-
      Dividing a numeric variable into a few classes for a map, by
      choosing how many classes there are and where the breaks between
      them fall.

  - term: equal intervals
    aliases: [equal interval, equal-interval]
    chapters: [thematic-maps-tmap]
    definition: >-
      A classification method that makes every class cover the same
      range of values.

  - term: choropleth map
    aliases: [choropleth, choropleths, choropleth maps]
    chapters: [thematic-maps-tmap]
    definition: >-
      A map that shades areas, such as counties or buildings, by the
      value of a variable.

  - term: extent
    aliases: [map extent]
    chapters: [thematic-maps-tmap, geographic-information]
    definition: >-
      The area a map or a layer covers, from its westernmost to
      easternmost and southernmost to northernmost points.

  - term: scale bar
    aliases: [scale bars]
    chapters: [thematic-maps-tmap]
    definition: >-
      A bar on a map that shows how distances on the map relate to
      distances on the ground.

  - term: north arrow
    aliases: [north arrows, compass]
    chapters: [thematic-maps-tmap]
    definition: >-
      A symbol on a map that shows which direction is north. In tmap,
      `tm_compass()`.

  - term: basemap
    aliases: [basemaps, basemap tiles]
    chapters: [thematic-maps-tmap]
    definition: >-
      A background map of streets, places, or imagery, loaded from the
      web as tiles, that your own data are drawn on top of.

  - term: interactive map
    aliases: [interactive maps, interactive web map]
    chapters: [thematic-maps-tmap]
    definition: >-
      A web map you can pan, zoom, and click to see each feature's
      attributes. tmap makes one in view mode.

  - term: GeoJSON
    case_sensitive: true
    definition: >-
      An open, plain-text format for vector features, written in JSON.
      Coordinates are longitude first, then latitude, in WGS84.

  # --- What Is Geographic Data? -----------------------------------------------

  - term: entity
    aliases: [entities]
    chapters: [geographic-information]
    definition: >-
      A real-world object or thing we want to record, such as a tree, a
      building, or a lake.

  - term: data abstraction
    aliases: [abstraction]
    chapters: [geographic-information]
    definition: >-
      The process of making the real world readable by a computer: from
      reality, to a data model, to a data structure, to machine code.

  - term: data model
    aliases: [data models, geographic data model, geographic data models]
    chapters: [geographic-information]
    definition: >-
      A formal way of representing geographic information in a computer,
      deciding which objects and properties to keep. Vector and raster
      are the two main ones.

  - term: data structure
    aliases: [data structures]
    chapters: [geographic-information]
    definition: >-
      How a data model is actually laid out in memory or on disk, such
      as lists of coordinates and tables.

  - term: continuous data
    aliases: [continuous]
    chapters: [geographic-information]
    definition: >-
      Data with a value everywhere on the map that changes from place to
      place, such as elevation or temperature.

  - term: discrete object
    aliases: [discrete objects, discrete]
    chapters: [geographic-information]
    definition: >-
      Something that exists in one place and not another, with clear
      edges, such as a road, a house, or a state.

  - term: generalization
    aliases: [generalize, generalized]
    chapters: [geographic-information]
    definition: >-
      Simplifying features when a map shows a place at a smaller scale,
      for example drawing a city as a point instead of an area.

  - term: map scale
    aliases: [large-scale map, small-scale map, large scale, small scale]
    chapters: [geographic-information]
    definition: >-
      The ratio of a distance on the map to the same distance on the
      ground. A large-scale map (1:10,000) shows a small area in detail;
      a small-scale map (1:10,000,000) shows a large area with little
      detail.

  - term: spatial data
    aliases: [non-spatial data]
    chapters: [geographic-information]
    definition: >-
      Data that have a location, such as campus buildings or rain
      gauges. Data with no location of their own, such as class grades,
      are non-spatial.

  - term: node
    aliases: [nodes]
    chapters: [geographic-information]
    definition: >-
      The start or end point of a line. Lines in a network, such as
      streets, connect at nodes.

  - term: vertex
    aliases: [vertices]
    chapters: [geographic-information]
    definition: >-
      A point between the ends of a line where it changes direction.
      More vertices make a smoother line and a bigger file.

  - term: line segment
    aliases: [line segments]
    chapters: [geographic-information]
    definition: >-
      The straight piece of a line between two vertices.

  - term: thematic layer
    aliases: [thematic layers]
    chapters: [geographic-information]
    definition: >-
      A layer that holds one theme of features, such as roads, soils, or
      elevation. Layers that share a coordinate system stack into a map.

  - term: overlay analysis
    aliases: [overlay]
    chapters: [geographic-information]
    definition: >-
      Combining thematic layers to find places that meet several
      conditions at once, such as wetlands on one soil type near a road.

  - term: cell
    aliases: [cells, grid cell, grid cells]
    chapters: [geographic-information]
    definition: >-
      One square of a raster's grid. Each cell holds exactly one value.

  - term: cell size
    aliases: [cell sizes]
    chapters: [geographic-information]
    definition: >-
      The length of one side of a raster cell in real-world units, such
      as 30 m. It is the raster's resolution.

  - term: resolution
    chapters: [geographic-information]
    definition: >-
      How much detail a raster holds, set by its cell size: smaller
      cells mean higher resolution, and more data.

  - term: origin
    chapters: [geographic-information]
    definition: >-
      The corner of a raster, usually the lower left, whose coordinates
      fix where the whole grid sits.

  - term: no data
    aliases: [NoData]
    chapters: [geographic-information]
    definition: >-
      A flag for raster cells with no measurement. In R these cells
      become `NA`.

  - term: matrix
    aliases: [matrices]
    chapters: [geographic-information]
    definition: >-
      A grid of values in R with rows and columns, all of the same type,
      made with `matrix()`. A small raster can be held in one.

  - term: topological data structure
    aliases: [topological, topology]
    chapters: [geographic-information]
    definition: >-
      A data structure that records how features connect and share
      boundaries, so a shared border is stored only once.

  - term: shapefile
    aliases: [shapefiles]
    chapters: [geographic-information]
    definition: >-
      Esri's common format for vector data: a group of files with the
      same name (`.shp`, `.shx`, `.dbf`, `.prj`, and more) that must be
      kept together.

  - term: KML
    case_sensitive: true
    definition: >-
      Keyhole Markup Language: the XML-based format behind Google Earth.
      A `.kmz` file is a zipped KML file.

  - term: GeoTIFF
    aliases: [GeoTIFFs]
    case_sensitive: true
    definition: >-
      The standard file format for raster data: a TIFF image with its
      location and coordinate system stored inside the file.

  - term: Cloud Optimized GeoTIFF (COG)
    aliases: [Cloud Optimized GeoTIFF, COG]
    definition: >-
      A GeoTIFF arranged in tiles with zoomed-out copies, so software
      can read only the area and detail it needs.

  - term: WGS84
    case_sensitive: true
    definition: >-
      The World Geodetic System of 1984, the datum GPS uses. GeoJSON and
      KML give coordinates as WGS84 longitude and latitude.

  - term: FGDC
    case_sensitive: true
    definition: >-
      The Federal Geographic Data Committee, whose metadata standard US
      federal agencies follow. Internationally, the standard is ISO
      19115.

  # --- Chapter 11: Location and Coordinate Systems -------------------------------

  - term: geodesy
    definition: >-
      The science of measuring the Earth's size, shape, orientation, and
      gravity. Every coordinate rests on a geodetic model of the Earth.

  - term: ellipsoid
    aliases: [ellipsoids, spheroid, spheroids, oblate spheroid]
    definition: >-
      A sphere flattened at the poles: the smooth mathematical shape used
      to model the Earth, defined by its semi-major and semi-minor axes.

  - term: semi-major axis
    definition: >-
      On an ellipsoid, the distance from the center to the Equator: about
      6,378 km for the Earth.

  - term: semi-minor axis
    definition: >-
      On an ellipsoid, the distance from the center to a pole: about
      6,357 km for the Earth.

  - term: flattening
    chapters: [location-coordinate-systems]
    definition: >-
      How much an ellipsoid is squashed: (a − b) / a, where a and b are
      the semi-major and semi-minor axes. About 1/298 for the Earth.

  - term: geoid (shape of the Earth)
    aliases: [geoid]
    case_sensitive: true
    chapters: [location-coordinate-systems]
    definition: >-
      The lumpy shape of the Earth defined by gravity, roughly where mean
      sea level would be. Ellipsoids are smooth approximations of it.

  - term: datum
    aliases: [datums, geodetic datum, geodetic datums]
    definition: >-
      A model that fixes an ellipsoid to the real Earth, so that a
      latitude and longitude point to one place on the ground. NAD83 and
      WGS84 are datums.

  - term: benchmark
    aliases: [benchmarks, control point, control points]
    chapters: [location-coordinate-systems]
    definition: >-
      A surveyed point marked on the ground, often by a brass disk, whose
      position is precisely known. Datums are made real by thousands of
      them.

  - term: NAD27
    case_sensitive: true
    definition: >-
      The North American Datum of 1927, based on the Clarke 1866
      ellipsoid and a single origin point in Kansas.

  - term: NAD83
    case_sensitive: true
    definition: >-
      The North American Datum of 1983, based on the GRS80 ellipsoid and
      maintained through a network of permanent GPS stations (CORS).

  - term: CORS
    case_sensitive: true
    definition: >-
      Continuously Operating Reference Stations: permanent GPS stations
      across the US that the National Geodetic Survey uses to maintain
      NAD83.

  - term: latitude
    aliases: [latitudes]
    definition: >-
      The angle north or south of the Equator, from 0° to 90°. Lines of
      equal latitude are parallels.

  - term: longitude
    aliases: [longitudes]
    definition: >-
      The angle east or west of the Prime Meridian, from 0° to 180°.
      Lines of equal longitude are meridians.

  - term: parallel
    aliases: [parallels]
    chapters: [location-coordinate-systems]
    definition: >-
      A line of latitude. Parallels run east–west, parallel to the
      Equator.

  - term: meridian
    aliases: [meridians]
    definition: >-
      A line of longitude. Meridians run from pole to pole and meet at
      the poles.

  - term: Equator
    case_sensitive: true
    definition: >-
      The circle halfway between the North and South Poles: 0° latitude.

  - term: Prime Meridian
    case_sensitive: true
    definition: >-
      The meridian through Greenwich, England, chosen in 1884 as 0°
      longitude.

  - term: graticule
    aliases: [graticules]
    definition: >-
      The network of parallels and meridians drawn on a map or globe.

  - term: decimal degrees
    aliases: [DD]
    case_sensitive: true
    definition: >-
      Coordinates written as signed decimal numbers, such as −79.05°.
      Negative means south latitude or west longitude.

  - term: degrees, minutes, and seconds
    aliases: [DMS, "degrees-minutes-seconds"]
    definition: >-
      Coordinates written as whole degrees, minutes (1/60 of a degree),
      and seconds (1/3,600 of a degree), with a letter N, S, E, or W,
      such as 79° 3′ 21″ W.

  - term: map projection
    aliases: [map projections, projection, projections, projected]
    definition: >-
      A method for flattening the curved graticule onto a flat map.
      Every projection distorts shape, area, distance, or direction.

  - term: conformal
    definition: >-
      Describes a projection that preserves local shapes and angles, such
      as Mercator or Lambert Conformal Conic.

  - term: equal-area
    definition: >-
      Describes a projection that preserves area, such as Albers or
      Mollweide. No projection is both equal-area and conformal.

  - term: equidistant
    definition: >-
      Describes a projection that preserves distance from one point, or
      along chosen lines.

  - term: azimuthal
    chapters: [location-coordinate-systems]
    definition: >-
      Describes a projection that preserves direction from a center
      point. Also called planar.

  - term: compromise projection
    aliases: [compromise projections, compromise]
    chapters: [location-coordinate-systems]
    definition: >-
      A projection, such as Robinson, that preserves no property exactly
      but keeps every distortion moderate.

  - term: secant
    definition: >-
      Describes a map surface that cuts through the globe, meeting it
      along two standard lines where the scale is true.

  - term: standard line
    aliases: [standard lines]
    definition: >-
      A line where a map projection's surface touches the globe, so the
      scale there is exactly true.

  - term: Mercator projection
    aliases: [Mercator]
    case_sensitive: true
    definition: >-
      A conformal cylindrical projection, made for navigation, that
      greatly enlarges areas near the poles.

  - term: State Plane Coordinate System
    aliases: [State Plane]
    case_sensitive: true
    definition: >-
      A set of local projections for the US, with one or more zones per
      state, in feet or meters. North Carolina's zone is EPSG:32119.

  - term: EPSG code
    aliases: [EPSG codes, EPSG]
    case_sensitive: true
    definition: >-
      A number that identifies a coordinate reference system in a public
      registry, such as 4326 for WGS84 latitude and longitude.

  # --- Chapter 12: Joins ---------------------------------------------------------

  - term: key
    aliases: [keys]
    chapters: [joins]
    definition: >-
      The column whose values are matched to line up rows in a join, such
      as a student ID or a county FIPS code.

  - term: attribute join
    aliases: [attribute joins]
    definition: >-
      A join that matches rows using a shared key column.

  - term: spatial join
    aliases: [spatial joins]
    definition: >-
      A join that matches features by their location, such as attaching
      to each point the polygon it falls inside. `st_join()` in R.

  - term: inner join
    aliases: [inner joins]
    definition: >-
      A join that keeps only the rows whose key appears in both tables.
      `inner_join()` in dplyr.

  - term: left join
    aliases: [left joins]
    definition: >-
      A join that keeps every row of the first (left) table, with NA
      where the second table has no match. `left_join()` in dplyr.

  - term: right join
    aliases: [right joins]
    definition: >-
      A join that keeps every row of the second (right) table.
      `right_join()` in dplyr.

  - term: full join
    aliases: [full joins]
    definition: >-
      A join that keeps every row of both tables, with NA wherever there
      is no match. `full_join()` in dplyr.

  - term: natural join
    aliases: [natural joins]
    definition: >-
      An inner join on every column the two tables share by name. Handy
      but fragile, so name your key instead.

  - term: cross join
    aliases: [cross joins, cartesian product]
    definition: >-
      A join that pairs every row of one table with every row of the
      other. `cross_join()` in dplyr.

  - term: self join
    definition: >-
      A join of a table to itself, such as employees to their managers.

  - term: cardinality
    definition: >-
      How many rows in one table can match a row in another: one-to-one,
      one-to-many, many-to-one, or many-to-many.

  - term: one-to-one
    definition: >-
      A relationship where each row matches at most one row in the other
      table, such as states and governors.

  - term: one-to-many
    definition: >-
      A relationship where one row matches many rows in the other table,
      such as a state and its cities.

  - term: many-to-one
    definition: >-
      A relationship where many rows match one row in the other table,
      such as cities and their state.

  - term: many-to-many
    definition: >-
      A relationship where rows on both sides can match many rows, such
      as students and classes. Joins like this multiply rows.

  - term: destination table
    aliases: [destination feature class, destination layer, destination]
    chapters: [joins]
    definition: >-
      In a join, the table that receives new columns: `x` in
      `st_join(x, y)`.

  - term: source table
    aliases: [source feature class, source layer, source]
    chapters: [joins]
    definition: >-
      In a join, the table that supplies the new columns: `y` in
      `st_join(x, y)`.

  - term: summarized join
    aliases: [summarized joins, summarized spatial join]
    definition: >-
      A spatial join that aggregates all the matching features, such as
      counting the schools in each county.

  - term: simple join
    aliases: [simple joins, simple spatial join]
    definition: >-
      A spatial join that attaches the attributes of one matching
      feature, such as the county each school is in.

  # --- Chapter 13: Exploratory Spatial Data Analysis -----------------------------

  - term: exploratory data analysis (EDA)
    aliases: [exploratory data analysis, EDA]
    definition: >-
      Learning what is in a dataset, with summaries and plots, before
      trying to explain or predict anything with it.

  - term: exploratory spatial data analysis (ESDA)
    aliases: [exploratory spatial data analysis, ESDA]
    definition: >-
      EDA that also asks how values vary across space, using maps,
      spatial autocorrelation, and clustering.

  - term: central tendency
    definition: >-
      One value that describes the center of a set of values: the mean,
      median, or mode.

  - term: mode
    chapters: [esda, spatial-statistics]
    case_sensitive: true
    definition: >-
      The most common value. The only measure of center that works for
      categorical data.

  - term: dispersion
    definition: >-
      How spread out values are around their center, measured by the
      range, interquartile range, or standard deviation.

  - term: range
    chapters: [esda]
    case_sensitive: true
    definition: >-
      The largest value minus the smallest. `range()` in R returns both.

  - term: quartile
    aliases: [quartiles]
    definition: >-
      The values that split sorted data into four groups of equal size.
      Q1 is the 25th percentile and Q3 the 75th.

  - term: interquartile range (IQR)
    aliases: [interquartile range, IQR]
    definition: >-
      Q3 minus Q1: the spread of the middle half of the data. Outliers
      barely affect it. `IQR()` in R.

  - term: histogram
    aliases: [histograms]
    definition: >-
      A chart that divides a variable's range into bins and draws a bar
      for how many values fall in each. `geom_histogram()` in ggplot2.

  - term: bin width
    aliases: [binwidth, bins]
    definition: >-
      The width of each bar in a histogram. Too narrow shows noise; too
      wide hides detail.

  - term: density plot
    aliases: [density plots]
    definition: >-
      A smoothed histogram whose total area is 1. `geom_density()` in
      ggplot2.

  - term: distribution
    aliases: [distributions]
    chapters: [esda, spatial-statistics]
    definition: >-
      How a variable's values are spread out: where they are common,
      where they are rare, and the shape that makes.

  - term: bimodal
    definition: >-
      Having two peaks. It often means two different groups are mixed
      together.

  - term: multimodal
    definition: >-
      Having several peaks.

  # --- Chapter 14: Spatial Descriptive Statistics --------------------------------

  - term: spatial descriptive statistics
    aliases: [spatial descriptive statistic]
    definition: >-
      Statistics that describe the center and spread of a set of
      locations, such as the mean center and standard distance.

  - term: mean center
    aliases: [mean centers]
    definition: >-
      The average x coordinate and average y coordinate of a set of
      features. Like the mean, outliers pull it.

  - term: weighted mean center
    aliases: [weighted mean centers]
    definition: >-
      A mean center in which each feature counts in proportion to an
      attribute, such as population.

  - term: central feature
    definition: >-
      The existing feature with the smallest total distance to all the
      others: the spatial counterpart of the median.

  - term: standard distance
    definition: >-
      The typical distance of features from their mean center: the
      spatial counterpart of the standard deviation, drawn as a circle.

  - term: centroid
    aliases: [centroids]
    definition: >-
      The geometric center of a polygon. `st_centroid()` in R.

  - term: return value
    definition: >-
      What a function gives back. In R, it is the value of the last line
      in the function's body.

  - term: normal distribution
    aliases: [bell curve]
    definition: >-
      A symmetric, bell-shaped distribution. About 68% of values fall
      within one standard deviation of the mean, and 95% within two.

  # --- Chapter 15: Blocks, Loops, and Functions -------------------------------

  - term: if statement
    aliases: [if statements]
    definition: >-
      Code that runs a block only when a test is `TRUE`:
      `if (x < 5) { ... }`. Add `else { ... }` for when it is `FALSE`.

  - term: while loop
    aliases: [while loops]
    definition: >-
      A loop that repeats its block for as long as a test stays `TRUE`.
      Something in the block must change the test, or it never stops.

  - term: for loop
    aliases: [for loops]
    definition: >-
      A loop that runs its block once for each item in a vector, such as
      `for (f in files) { ... }`, then stops.

  - term: loop variable
    definition: >-
      The variable in a `for` loop that takes the next item of the vector
      on each pass, such as `f` in `for (f in files)`.

  - term: infinite loop
    aliases: [infinite loops]
    definition: >-
      A loop that never ends because its test never becomes `FALSE`. Stop
      it with Esc or RStudio's red stop sign.

  - term: default value
    aliases: [default values]
    definition: >-
      The value an argument takes when you don't supply one, set with `=`
      in the function definition: `function(x, factor = 1.609)`.

  - term: local environment
    definition: >-
      The private workspace R makes each time a function runs. Its
      arguments and variables live there and vanish when it finishes.

  - term: global environment
    definition: >-
      Your main R workspace, where the variables you create at the Console
      or in a script live. Functions don't change it unless you assign
      their result.

  - term: scope
    chapters: [blocks-loops-functions]
    definition: >-
      Which variables a piece of code can see. A function's arguments are
      in its own scope, separate from variables outside it.

  # --- Chapter 17: ArcGIS Data with arcpullr -----------------------------------

  - term: arcpullr
    definition: >-
      An R package that downloads layers from ArcGIS REST services as sf
      objects, with `get_spatial_layer()`.

  - term: ArcGIS Online
    case_sensitive: true
    aliases: [ArcGIS Enterprise]
    definition: >-
      Esri's systems for publishing and sharing maps and GIS layers on the
      web. Many agencies' data portals run on them.

  - term: portal
    aliases: [portals, data portal]
    chapters: [arcpullr]
    definition: >-
      A website where an organization publishes GIS data for people to
      search, preview, and download, such as NC OneMap.

  - term: NC OneMap
    case_sensitive: true
    definition: >-
      North Carolina's statewide GIS data portal,
      <https://www.nconemap.gov/>, with layers from state and local
      agencies.

  - term: feature service
    aliases: [feature services, feature layer, feature layers]
    definition: >-
      A layer published on an ArcGIS server whose features and attributes
      can be requested through its REST endpoint.

  - term: REST Services Directory
    case_sensitive: true
    aliases: [ArcGIS REST Services Directory]
    definition: >-
      The plain web page an ArcGIS server shows for each service and layer,
      listing its layer ID, geometry type, MaxRecordCount, and fields.

  - term: layer ID
    definition: >-
      The number at the end of an ArcGIS layer's URL, such as the `2` in
      `.../MapServer/2`, that picks one layer out of a service.

  - term: MaxRecordCount
    case_sensitive: true
    definition: >-
      The most features an ArcGIS server returns for one request.
      arcpullr asks for larger layers in batches.

  - term: SQL
    case_sensitive: true
    definition: >-
      Structured Query Language, the language of databases. ArcGIS `where`
      clauses use it: `fcounty = 'Orange'`.

  - term: where clause
    aliases: [where clauses]
    definition: >-
      An SQL filter, such as `"fcounty = 'Orange'"`, that the server
      applies before sending data back, so you download only what you
      need.

  - term: dynamic data
    aliases: [dynamic]
    chapters: [arcpullr, writing-spatial-data-science]
    definition: >-
      Data that are continually updated, so the same request may return
      different data later. Static data are a fixed snapshot.

  # --- Chapter 18: Comparing Groups: p-values and ANOVA -----------------------

  - term: statistic
    aliases: [statistics]
    chapters: [anova]
    definition: >-
      A number calculated from a sample that summarizes the data, such as
      a mean. It would change if you drew a different sample.

  - term: test statistic
    aliases: [test statistics]
    definition: >-
      A statistic that weighs evidence in a hypothesis test, such as *t*
      or *F*: how large a pattern is compared with random variation.

  - term: null hypothesis
    aliases: [null hypotheses, H₀]
    definition: >-
      The claim a test starts from: that there is no difference or no
      relationship. A small p-value is evidence against it.

  - term: alternative hypothesis
    aliases: [H₁]
    definition: >-
      The claim that there is a difference or relationship, such as "at
      least one group mean differs".

  - term: p-value
    aliases: [p-values, p value, p values]
    definition: >-
      The probability of a result at least as extreme as yours if the
      null hypothesis were true. It is not the chance the null hypothesis
      is true.

  - term: statistically significant
    aliases: [statistical significance, significant]
    chapters: [anova, regression, spatial-autocorrelation]
    definition: >-
      By convention, a result with *p* < 0.05. Significant doesn't mean
      large or important.

  - term: p-hacking
    definition: >-
      Re-running an analysis in different ways until a p-value falls below
      0.05, which produces false findings.

  - term: replication crisis
    definition: >-
      The discovery, in the 2010s, that many published findings fail to
      hold up when other researchers repeat the studies.

  - term: F statistic
    aliases: [F statistics, F-statistic]
    definition: >-
      ANOVA's test statistic: the variance between groups divided by the
      variance within groups. Near 1 if the groups don't differ.

  - term: sum of squares
    aliases: [sums of squares]
    definition: >-
      The squared distances of values from a mean, added up. ANOVA splits
      it into between-group and within-group parts.

  - term: degrees of freedom
    definition: >-
      The number of values free to vary in a calculation. In ANOVA, *k* −
      1 between groups and *N* − *k* within them.

  - term: mean square
    aliases: [mean squares]
    definition: >-
      A sum of squares divided by its degrees of freedom: a variance. *F*
      is the ratio of two mean squares.

  - term: F distribution
    definition: >-
      The values of *F* you'd expect if the null hypothesis were true. Its
      shape depends on two degrees of freedom. `pf()` in R.

  - term: t-test
    aliases: [t-tests]
    definition: >-
      A test of whether the means of two groups differ. ANOVA extends it
      to three or more groups.

  - term: post-hoc test
    aliases: [post-hoc tests]
    definition: >-
      A test run after an ANOVA to find which pairs of groups differ, such
      as Tukey's HSD.

  - term: Tukey's HSD
    case_sensitive: true
    aliases: [Tukey's honestly significant difference, TukeyHSD]
    definition: >-
      Tukey's honestly significant difference test: compares every pair of
      groups after an ANOVA, with p-values adjusted for the number of
      comparisons.

  - term: Shapiro-Wilk test
    case_sensitive: true
    definition: >-
      A test of whether values, such as a model's residuals, are normally
      distributed. A large p-value means no evidence against normality.

  - term: Welch's ANOVA
    case_sensitive: true
    definition: >-
      A version of ANOVA that doesn't assume the groups have equal
      variances. `oneway.test()` in R.

  - term: Kruskal-Wallis test
    case_sensitive: true
    definition: >-
      A test of whether three or more groups differ, using ranks instead
      of values, so it doesn't need normal data. `kruskal.test()` in R.

  # --- Chapter 19: Linear Regression --------------------------------------------

  - term: dependent variable
    aliases: [dependent variables]
    definition: >-
      The outcome a model explains, *y*. It goes on the left of the `~` in
      an R formula.

  - term: independent variable
    aliases: [independent variables, explanatory variable, explanatory variables]
    definition: >-
      A variable used to explain the dependent variable, *x*. It goes on
      the right of the `~`.

  - term: correlation
    chapters: [regression, spatial-autocorrelation]
    definition: >-
      Whether two variables move together. It doesn't say how much one
      changes with the other, or which causes which.

  - term: correlation coefficient
    chapters: [regression]
    definition: >-
      *r*, from −1 to 1: how closely two variables follow a straight line,
      and in which direction. `cor()` in R.

  - term: line of best fit
    definition: >-
      The straight line that comes closest to the points in a scatterplot:
      a regression's estimate of *y* for each *x*.

  - term: ordinary least squares
    aliases: [OLS]
    definition: >-
      The usual way to fit a regression line: choose the line that makes
      the sum of squared residuals as small as possible.

  - term: intercept
    definition: >-
      The predicted value of *y* when every *x* is 0: where the regression
      line crosses the y axis.

  - term: slope
    chapters: [regression]
    definition: >-
      How much *y* changes when *x* goes up by one unit: the coefficient
      of an independent variable.

  - term: coefficient
    aliases: [coefficients]
    chapters: [regression, writing-spatial-data-science]
    definition: >-
      A number a regression estimates: the intercept, or the slope for
      each independent variable.

  - term: R-squared
    aliases: [R², R squared, multiple R-squared]
    definition: >-
      The share of the variation in *y* that a model explains, from 0 to
      1.

  - term: adjusted R-squared
    aliases: [adjusted R²]
    definition: >-
      R-squared lowered a little for each independent variable, so adding
      useless variables can't make a model look better. Use it to compare
      models.

  - term: residual
    aliases: [residuals]
    definition: >-
      An observation's actual value minus the value a model predicts for
      it. Map them to see where a model fits poorly.

  - term: extrapolation
    definition: >-
      Using a model to predict outside the range of the data it was
      fitted to. The relationship may not hold there.

  - term: multivariate regression
    aliases: [multiple regression, multivariate model]
    definition: >-
      A regression with more than one independent variable. Each
      coefficient is the change in *y* with the others held constant.

  - term: linear model
    aliases: [linear models]
    definition: >-
      A model in which *y* is a straight-line function of the *x*
      variables. `lm()` in R.

  - term: spatial lag model
    aliases: [spatial lag models]
    definition: >-
      A spatial regression model that includes the neighbors' values of
      *y* as an extra explanatory variable.

  - term: spatial error model
    aliases: [spatial error models]
    definition: >-
      A spatial regression model that allows the errors of neighboring
      observations to be correlated.

  # --- Chapter 20: Writing a Spatial Data Science Project ----------------------

  - term: DIKW pyramid
    case_sensitive: true
    definition: >-
      Data, information, knowledge, wisdom: four levels, each built on the
      one below, from raw facts to judging what is true and right.

  - term: big data
    definition: >-
      Data too large, fast, or varied for ordinary tools, often described
      by three Vs: volume, velocity, and variety.

  - term: replicability
    aliases: [replicable]
    definition: >-
      When a new study, with new data, answering the same question gets
      consistent results.

  - term: open science
    definition: >-
      Doing research so others can check and reuse it: open access
      papers, open data, open methods, and open-source software.

  - term: research question
    aliases: [research questions]
    definition: >-
      The specific, answerable question a project sets out to answer,
      usually with a place and a time.

  # --- Chapter 21: Distance and Neighborhoods ---------------------------------

  - term: physical distance
    definition: >-
      Separation measured across the Earth's surface, in meters,
      kilometers, or miles.

  - term: social distance
    definition: >-
      Separation measured by connection, similarity, or interaction, which
      a ruler can't measure.

  - term: distance decay
    definition: >-
      Interaction between places falls as the distance between them grows,
      because crossing distance costs time, money, or effort.

  - term: isochrone
    aliases: [isochrones]
    definition: >-
      A line, or area, of equal travel time from a place, such as
      everywhere within a 15-minute drive of a hospital.

  - term: Euclidean distance
    case_sensitive: true
    definition: >-
      Straight-line distance, from the Pythagorean theorem. Use it only
      with projected coordinates.

  - term: great circle distance
    aliases: [great circle distances]
    definition: >-
      The shortest distance between two points along the Earth's curved
      surface. Use it for longitude and latitude.

  - term: haversine formula
    definition: >-
      A formula for great circle distance that stays accurate for very
      short distances.

  - term: Manhattan distance
    case_sensitive: true
    aliases: [city-block distance]
    definition: >-
      Distance along a grid of streets: the horizontal plus the vertical
      difference, never shorter than the straight line.

  - term: network distance
    definition: >-
      Distance along the lines of a network, such as streets, adding up
      the lengths of the segments on the route.

  - term: travel time
    chapters: [distance-neighborhoods]
    definition: >-
      Separation measured in minutes along a network, using speeds,
      turns, and traffic, instead of meters.

  - term: topology
    chapters: [distance-neighborhoods]
    definition: >-
      How features connect, such as which polygons touch, regardless of
      the distances between them.

  - term: binary weights
    aliases: [binary weight, binary neighbors]
    definition: >-
      Neighbor weights of 1 for a neighbor and 0 for everything else.

  - term: continuous weights
    aliases: [continuous neighbors]
    definition: >-
      Neighbor weights that vary, usually falling with distance, so closer
      neighbors count more.

  - term: distance band
    aliases: [distance bands]
    definition: >-
      A neighbor definition: every feature within a set threshold distance
      is a neighbor. `dnearneigh()` in spdep.

  - term: inverse distance weights
    aliases: [inverse distance weight, inverse-distance weights]
    definition: >-
      Neighbor weights of 1 / *d*^*x*, so a neighbor's weight falls as its
      distance grows.

  - term: distance-decay parameter
    definition: >-
      The power *x* in inverse distance weights, 1 / *d*^*x*. Larger values
      make weights fall off faster.

  - term: edge effect
    definition: >-
      Features near the edge of a study area get too few neighbors because
      the data stop at the boundary.

  - term: k nearest neighbors
    aliases: [nearest neighbors, nearest-neighbor]
    chapters: [distance-neighborhoods, spatial-autocorrelation]
    definition: >-
      A neighbor definition: each feature's neighbors are the *k* features
      closest to it. Every feature gets exactly *k*.

  - term: contiguity
    aliases: [contiguity-based]
    definition: >-
      Sharing a border. Contiguity neighbors are polygons that touch, by
      the rook or queen rule.

  - term: rook contiguity
    aliases: [rook neighbors, rook rule]
    definition: >-
      Polygons are neighbors only if they share an edge. On a grid, each
      cell has four.

  - term: queen contiguity
    aliases: [queen neighbors, queen rule]
    definition: >-
      Polygons are neighbors if they share an edge or just a corner. On a
      grid, each cell has eight. spdep's default.

  - term: Thiessen polygons
    case_sensitive: true
    aliases: [Voronoi polygons]
    definition: >-
      Polygons drawn around a set of points so each holds the area closer
      to its point than to any other.

  - term: second-order neighbors
    definition: >-
      The neighbors of a feature's neighbors.

  - term: neighborhood weight matrix
    aliases: [weight matrix, weight matrices, spatial weights matrix, spatial weights]
    definition: >-
      An *n* × *n* table, **W**, whose entry *w*~*ij*~ records the
      neighbor relationship between observations *i* and *j*.

  - term: row standardization
    aliases: [row-standardized, row-standardize]
    definition: >-
      Dividing each weight by its row's total so every row sums to 1. Then
      **W** times a variable gives the neighbors' average.

  - term: spatial lag
    definition: >-
      The weighted average of an observation's neighbors' values,
      calculated with row-standardized weights. `lag.listw()` in spdep.

  - term: neighbor list
    aliases: [neighbor lists]
    definition: >-
      spdep's compact way of storing neighbors (class `nb`): each
      observation's neighbors, without all the zeros of a matrix.

  # --- Chapter 22: Spatial Clustering and Spatial Autocorrelation -------------

  - term: geographic variation
    definition: >-
      The change in a phenomenon from place to place, such as income from
      county to county.

  - term: global statistic
    aliases: [global statistics]
    definition: >-
      A statistic that gives one value for a whole study area, such as
      Moran's I. It doesn't say where clusters are.

  - term: local statistic
    aliases: [local statistics]
    definition: >-
      A statistic calculated for each observation from its neighbors, such
      as Gi*, so its results can be mapped.

  - term: spatial pattern
    aliases: [spatial patterns]
    definition: >-
      The arrangement of objects in space: clustered, random, or
      dispersed.

  - term: Average Nearest Neighbor ratio
    case_sensitive: true
    aliases: [Average Nearest Neighbor, ANN, ANN ratio]
    definition: >-
      The observed mean distance from each point to its nearest neighbor
      divided by the mean expected at random. Below 1 is clustered.

  - term: complete spatial randomness
    definition: >-
      Points or values placed entirely at random, the baseline that
      spatial pattern and autocorrelation statistics compare against.

  - term: Moran's I
    case_sensitive: true
    definition: >-
      A global measure of spatial autocorrelation, from −1 (dispersed)
      through 0 (random) to +1 (clustered), with a p-value.

  - term: Monte Carlo test
    aliases: [permutation test, permutation tests, Monte Carlo]
    definition: >-
      A test that shuffles values across locations many times and asks how
      often the shuffles beat the observed statistic.

  - term: Getis-Ord Gi*
    case_sensitive: true
    aliases: [Gi*, Gi, Getis-Ord G, Getis G, Getis-Ord Gi]
    definition: >-
      A local statistic that gives each observation a z-score: large
      positive for hot spots, large negative for cold spots.

  - term: cold spot
    aliases: [cold spots]
    definition: >-
      An area of low values surrounded by low values: a large negative
      Gi* z-score.

  - term: z-score
    aliases: [z-scores]
    definition: >-
      How many standard deviations a value is from what's expected. Beyond
      ±1.96 is significant at the 0.05 level.

  - term: local Moran's I
    case_sensitive: true
    aliases: [Local Moran's I]
    definition: >-
      Moran's I calculated for each observation, to find clusters and
      outliers. `localmoran()` in spdep.

  # --- Chapter 23: What's Next in Spatial Data Science ------------------------

  - term: spatial epidemiology
    definition: >-
      The study of how health outcomes, such as disease cases, vary across
      places, and why.

  - term: scan statistic
    aliases: [scan statistics]
    definition: >-
      A cluster test that moves a window across a map (and often through
      time) to find areas with more cases than chance would produce.
      SaTScan is a widely used program for it.

  - term: accessibility
    chapters: [whats-next]
    definition: >-
      How easily people can reach a service, such as a clinic, given the
      distance or travel time, how many providers there are, and how many
      people need them.

  - term: two-step floating catchment area
    aliases: [2SFCA]
    definition: >-
      An accessibility measure that combines provider supply, population
      demand, and travel time, in two steps: one around each provider and
      one around each population location.

  - term: environmental justice
    definition: >-
      The fair sharing of environmental burdens, such as pollution, and
      benefits, such as parks, across communities, whatever their race or
      income.

  - term: urban heat island
    aliases: [urban heat islands]
    definition: >-
      An area of a city, usually paved and with few trees, that is hotter
      than its surroundings.

  - term: species distribution model
    aliases: [species distribution models]
    definition: >-
      A model, often a regression with environmental predictors, that
      predicts where a plant or animal can live.

  - term: location–allocation
    aliases: [location-allocation]
    definition: >-
      A method that chooses which of several candidate sites to use, such
      as for fire stations, so that they minimize travel or serve the most
      people.

  - term: location intelligence
    definition: >-
      The business use of spatial data and analysis, for site selection,
      routing, market areas, and real estate.

  - term: remote sensing
    definition: >-
      Collecting information about Earth without touching it, from sensors
      on satellites, aircraft, or drones. It produces most of the world's
      raster data.

  - term: passive sensor
    aliases: [passive sensors]
    chapters: [whats-next]
    definition: >-
      A sensor that records sunlight reflected from a surface, or heat the
      surface gives off, such as a camera or multispectral scanner.

  - term: active sensor
    aliases: [active sensors]
    chapters: [whats-next]
    definition: >-
      A sensor that sends out its own signal and measures what comes back,
      such as radar or lidar.

  - term: radar
    definition: >-
      An active sensor that sends out microwaves. It sees through clouds
      and at night, so it is used to map floods during storms.

  - term: lidar
    definition: >-
      An active sensor that measures distance with laser pulses, to build
      detailed 3D models of terrain, buildings, and trees.

  - term: spatial resolution
    definition: >-
      The size of one pixel on the ground, such as 30 m for Landsat.

  - term: spectral resolution
    definition: >-
      How many wavelength bands a sensor records, and how narrow they are.

  - term: temporal resolution
    definition: >-
      How often a sensor revisits the same place.

  - term: radiometric resolution
    definition: >-
      How finely a sensor records differences in brightness.

  - term: spectral signature
    definition: >-
      The pattern of how much light a material reflects at each
      wavelength. Different surfaces, such as plants, soil, and water,
      have different signatures.

  - term: NDVI
    case_sensitive: true
    aliases: [normalized difference vegetation index]
    definition: >-
      Normalized difference vegetation index: (NIR − Red) / (NIR + Red).
      It ranges from −1 to 1, and dense green vegetation is high.

  - term: image classification
    aliases: [classification]
    chapters: [whats-next]
    definition: >-
      Assigning each pixel of an image a land cover class, such as forest,
      water, or developed land.

  - term: change detection
    definition: >-
      Comparing images of the same place from different dates to find
      what changed.

  - term: space-time cube
    definition: >-
      A way to store space-time data: a map for every time step, stacked
      on top of each other, with x, y, and time as its three axes.

  - term: emerging hot spot analysis
    definition: >-
      Running a hot spot statistic, such as Gi*, for every time step and
      classifying each location's trend: new, intensifying, persistent, or
      diminishing.

  - term: spatiotemporal kriging
    definition: >-
      Predicting values at places and times with no measurements, from
      measurements nearby in both space and time.

  - term: GeoAI
    case_sensitive: true
    definition: >-
      Artificial intelligence methods, such as deep learning, applied to
      spatial data, for example to find buildings in satellite images.

  - term: geospatial foundation model
    aliases: [geospatial foundation models, foundation model, foundation models]
    definition: >-
      A large AI model pretrained on huge image archives that can be
      fine-tuned for many tasks, such as mapping floods, with little
      labeled data.

  - term: spatial cross-validation
    definition: >-
      Testing a model by holding out whole regions, rather than random
      observations, so the test data really are new places.

  - term: PostGIS
    case_sensitive: true
    definition: >-
      An extension that adds spatial data types and spatial queries, such
      as spatial joins, to the PostgreSQL database.

  - term: GISP
    case_sensitive: true
    definition: >-
      Geographic Information Systems Professional: a certification from the
      GIS Certification Institute for experienced GIS practitioners.

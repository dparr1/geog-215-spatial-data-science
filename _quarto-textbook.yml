# Textbook-only profile: `quarto render --profile textbook`. Used for
#   - the public copy on daveparr.com/intro-spatial-data-science/
#     (.github/workflows/publish.yml, HTML), and
#   - the PDF textbook (`quarto render --to PrettyPDF-pdf --profile textbook`).
# It leaves out the course pages (Welcome, Syllabus, Course materials, About)
# and the top menu, which live only on geog215.org, and it leaves out every
# quiz: the chapter quizzes and the unit quizzes. Quizzes are only on
# geog215.org (_quarto-site.yml). Links to quiz pages on the unit pages and in
# the Preface are wrapped in `content-hidden when-profile="textbook"` so they
# disappear here too.
#
# A book must start at index.qmd. With this profile index.qmd shows the
# Preface instead of the Welcome page (see the top of index.qmd).
project:
  render:
    - index.qmd
    - units/*.qmd
    - chapters/*.qmd
    # No quiz pages, not even as unlisted pages.
    - "!units/*-quiz.qmd"
    - "!chapters/*-quiz.qmd"
    - glossary.qmd
    - references.qmd

book:
  chapters:
    - index.qmd
    - part: units/unit-1.qmd
      chapters:
        - chapters/intro-spatial-data-science.qmd
        - chapters/r-rstudio-rmarkdown.qmd
        - chapters/r-basics.qmd
        - chapters/indexing-vectors-data-frames.qmd
        - chapters/blocks-loops-functions.qmd
    - part: units/unit-2.qmd
      chapters:
        - chapters/tidyverse-filter-pipe.qmd
        - chapters/tidyverse-arrange-select-mutate.qmd
        - chapters/tidyverse-summarize-group-by.qmd
        - chapters/tidyverse-ggplot.qmd
    - part: units/unit-3.qmd
      chapters:
        - chapters/thematic-maps-tmap.qmd
        - chapters/geographic-information.qmd
        - chapters/location-coordinate-systems.qmd
        - chapters/census-data-apis.qmd
        - chapters/arcpullr.qmd
    - part: units/unit-4.qmd
      chapters:
        - chapters/joins.qmd
        - chapters/esda.qmd
        - chapters/spatial-statistics.qmd
    - part: units/unit-5.qmd
      chapters:
        - chapters/anova.qmd
        - chapters/regression.qmd
        - chapters/writing-spatial-data-science.qmd
        - chapters/distance-neighborhoods.qmd
        - chapters/spatial-autocorrelation.qmd
    - part: units/unit-6.qmd
      chapters:
        - chapters/dashboards.qmd
        - chapters/whats-next.qmd
  appendices:
    - glossary.qmd
    - about.qmd
    - references.qmd

project:
  type: book
  output-dir: _book
  # Chapter quiz pages load these at run time (assets/quiz/quiz.js reads the
  # question banks in quizzes/), so copy them into the site.
  resources:
    - quizzes/*.json
    - assets/quiz/

book:
  title: "Spatial Data Science"
  subtitle: "Working draft"
  author: "David Parr"
  date: last-modified
  chapters:
    - index.qmd
    # Each chapter is followed by its (unnumbered) chapter quiz page.
    - chapters/intro-spatial-data-science.qmd
    - chapters/intro-spatial-data-science-quiz.qmd
    - chapters/r-rstudio-rmarkdown.qmd
    - chapters/r-rstudio-rmarkdown-quiz.qmd
    - chapters/census-data-apis.qmd
    - chapters/census-data-apis-quiz.qmd
  appendices:
    - glossary.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    code-copy: true
    code-overflow: wrap
    toc-depth: 3
    fig-cap-location: bottom
    tbl-cap-location: top
    # webexercises (interactive self-check questions); from
    # webexercises::add_to_quarto(), copied to include/ by hand
    css: include/webex.css
    include-after-body: include/webex.js
    # The Supabase sign-in gate is added only for geog215.org, by the
    # `geog215` profile (_quarto-geog215.yml). daveparr.com stays public.


  PrettyPDF-pdf:
    toc: true
    number-sections: true
    keep-tex: true

execute:
  # Re-run code only when a chapter's source changes; rendered results are
  # stored in _freeze/ and should be committed with the book.
  freeze: auto
  warning: false
  message: false

filters:
  - webr
  # Hover/tap definitions for the key terms in glossary.yml. Runs before
  # Quarto's own processing so callout titles are still headings (and skipped).
  - at: pre-ast
    path: filters/glossary/glossary.lua

webr:
  show-startup-message: false
  show-header-message: false
  autoload-packages: true

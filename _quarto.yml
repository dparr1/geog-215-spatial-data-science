project:
  type: book
  output-dir: _book

book:
  title: "Spatial Data Science"
  subtitle: "Working draft"
  author: "David Parr"
  date: last-modified
  chapters:
    - index.qmd
    - intro.qmd
    - chapters/census-data-apis.qmd

bibliography: references.bib

format:
  html:
    theme: cosmo
    code-copy: true
    code-overflow: wrap
    toc-depth: 3
    fig-cap-location: bottom
    tbl-cap-location: top
    # webexercises (interactive self-check questions); from
    # webexercises::add_to_quarto(), copied to include/ by hand
    css: include/webex.css
    include-after-body: include/webex.js
    # Sign-in gate: Supabase email codes, approved emails only
    # (database setup in supabase/setup.sql)
    include-in-header: assets/auth-gate.html


  PrettyPDF-pdf:
    toc: true
    number-sections: true
    keep-tex: true

execute:
  # Re-run code only when a chapter's source changes; rendered results are
  # stored in _freeze/ and should be committed with the book.
  freeze: auto
  warning: false
  message: false

filters:
  - webr

webr:
  show-startup-message: false
  show-header-message: false
  autoload-packages: true

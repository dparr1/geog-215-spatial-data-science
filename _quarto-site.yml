# Full site (default profile): course pages, top menu, and the textbook.
# Used for geog215.org (`--profile geog215` turns this on too).
book:
  # Top menu on every page. Welcome, Syllabus, About, AI policy (sidebar
  # only), and Privacy policy (sidebar and footer only) are public on
  # geog215.org; every other page asks students to sign in (see
  # PUBLIC_PAGES in assets/auth-gate.html).
  navbar:
    left:
      - href: index.qmd
        text: Welcome
      - href: syllabus.qmd
        text: Syllabus
      - href: materials.qmd
        text: Course materials
      - href: about.qmd
        text: About
      - href: preface.qmd
        text: Textbook     

  chapters:
    - part: "Course"
      chapters:
        - index.qmd
        - syllabus.qmd
        - ai-policy.qmd
        - materials.qmd
        - about.qmd
        - privacy.qmd
        - student-services.qmd
    # Each chapter is followed by its (unnumbered) chapter quiz page.
    - preface.qmd

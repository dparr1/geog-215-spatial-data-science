# geog215.org profile: `quarto render --profile geog215` adds the Supabase
# sign-in gate (instructor-issued access codes; setup in supabase/README.md).
# The default render, used for daveparr.com/geog215/, has no gate.
format:
  html:
    include-in-header: assets/auth-gate.html

# GA4 for geog215.org only. daveparr.com/geog215/ gets daveparr.com's own tag
# from that site's build, so this stays out of the default _quarto.yml.
book:
  google-analytics: "G-E3QTGKCHDQ"

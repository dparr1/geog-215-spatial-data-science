# geog215.org profile: `quarto render --profile geog215` adds the Supabase
# sign-in gate (instructor-issued access codes; setup in supabase/README.md).
# The default render, used for daveparr.com/intro-spatial-data-science/, has no gate.
format:
  html:
    include-in-header:
      - assets/auth-gate.html
      # Home-screen app: manifest, icons, iPhone tags, offline service worker.
      - assets/pwa-head.html
    # "Ask a question" on highlighted text, and "My questions" (needs the gate).
    # Then polls and surveys (banner + "Polls"; uses the dialog styles above),
    # and "Notifications" (announcements as push notifications).
    include-after-body:
      - assets/questions.html
      - assets/polls.html
      - assets/notifications.html

# GA4 for geog215.org only. daveparr.com/intro-spatial-data-science/ gets daveparr.com's own tag
# from that site's build, so this stays out of the default _quarto.yml.
book:
  google-analytics: "G-E3QTGKCHDQ"

  # Privacy policy link on every page (the sign-in screen links to it too).
  page-footer:
    center: "[Privacy policy](/privacy.html)"

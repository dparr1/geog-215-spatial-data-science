<!--
  Reading settings, part 2 of 2: the "Aa" menu next to search, where readers
  pick a font and text size. Choices are kept in this browser (localStorage)
  and applied on every page by assets/reader-settings-head.html.
-->
<script>
(function () {
  var FONTS = [
    { id: "", label: "Atkinson Hyperlegible (default)", css: '"Atkinson Hyperlegible Next", sans-serif' },
    { id: "sans", label: "Standard sans-serif", css: 'system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif' },
    { id: "serif", label: "Serif", css: 'Georgia, Cambria, "Times New Roman", serif' },
    { id: "dyslexic", label: "OpenDyslexic", css: '"OpenDyslexic", sans-serif' }
  ];
  var SIZES = { "-1": "Small", "0": "Default", "1": "Large", "2": "Larger", "3": "Largest" };
  var MIN = -1, MAX = 3;
  var root = document.documentElement;

  function save(key, value) {
    try {
      if (value === "" || value === "0") localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    } catch (e) { /* storage blocked: setting lasts for this page only */ }
  }
  function currentFont() { return root.getAttribute("data-reader-font") || ""; }
  function currentSize() { return parseInt(root.getAttribute("data-reader-size") || "0", 10) || 0; }

  function setFont(id) {
    if (id) root.setAttribute("data-reader-font", id); else root.removeAttribute("data-reader-font");
    save("sds-reader-font", id);
  }
  function setSize(n) {
    n = Math.max(MIN, Math.min(MAX, n));
    if (n) root.setAttribute("data-reader-size", String(n)); else root.removeAttribute("data-reader-size");
    save("sds-reader-size", String(n));
    refreshSize();
  }

  var wrap = document.createElement("div");
  wrap.className = "sds-reader";
  var fontOptions = FONTS.map(function (f) {
    return '<label style=\'font-family:' + f.css.replace(/'/g, "&#39;") + '\'>' +
      '<input class="form-check-input" type="radio" name="sds-reader-font" value="' + f.id + '"> ' + f.label + '</label>';
  }).join("");
  wrap.innerHTML =
    '<button type="button" class="sds-reader-toggle" aria-expanded="false" aria-controls="sds-reader-panel" ' +
      'title="Reading settings: font and text size">' +
      '<span aria-hidden="true">Aa</span><span class="visually-hidden">Reading settings</span></button>' +
    '<div class="sds-reader-panel" id="sds-reader-panel" role="dialog" aria-label="Reading settings" hidden>' +
      '<h2>Reading settings</h2>' +
      '<fieldset class="sds-reader-font"><legend>Font</legend>' + fontOptions + '</fieldset>' +
      '<fieldset><legend>Text size</legend><div class="sds-reader-size-row">' +
        '<button type="button" data-step="-1" aria-label="Smaller text">A&minus;</button>' +
        '<output aria-live="polite"></output>' +
        '<button type="button" data-step="1" aria-label="Larger text">A+</button>' +
      '</div></fieldset>' +
      '<button type="button" class="sds-reader-reset">Reset to defaults</button>' +
    '</div>';

  var toggle = wrap.querySelector(".sds-reader-toggle");
  var panel = wrap.querySelector(".sds-reader-panel");
  var output = wrap.querySelector("output");
  var minus = wrap.querySelector('[data-step="-1"]');
  var plus = wrap.querySelector('[data-step="1"]');

  function refreshFont() {
    var id = currentFont();
    wrap.querySelectorAll('input[name="sds-reader-font"]').forEach(function (r) { r.checked = r.value === id; });
  }
  function refreshSize() {
    var n = currentSize();
    output.textContent = SIZES[String(n)] || "Default";
    minus.disabled = n <= MIN;
    plus.disabled = n >= MAX;
  }
  function open(show) {
    panel.hidden = !show;
    toggle.setAttribute("aria-expanded", show ? "true" : "false");
    if (show) { refreshFont(); refreshSize(); var c = panel.querySelector("input:checked"); if (c) c.focus(); }
  }

  toggle.addEventListener("click", function (e) { e.stopPropagation(); open(panel.hidden); });
  panel.addEventListener("click", function (e) { e.stopPropagation(); });
  panel.addEventListener("change", function (e) { if (e.target.name === "sds-reader-font") setFont(e.target.value); });
  minus.addEventListener("click", function () { setSize(currentSize() - 1); });
  plus.addEventListener("click", function () { setSize(currentSize() + 1); });
  wrap.querySelector(".sds-reader-reset").addEventListener("click", function () { setFont(""); setSize(0); refreshFont(); });
  document.addEventListener("click", function () { if (!panel.hidden) open(false); });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && !panel.hidden) { open(false); toggle.focus(); }
  });

  // Put the button by search: in the top menu on
  // geog215.org, or by the sidebar search in the textbook-only build.
  var navSearch = document.querySelector("#quarto-header #quarto-search");
  if (navSearch) navSearch.parentNode.insertBefore(wrap, navSearch);
  else {
    var search = document.querySelector("#quarto-sidebar .sidebar-search, #quarto-sidebar #quarto-search, .sidebar-tools-main");
    if (search && search.parentNode) search.parentNode.insertBefore(wrap, search.nextSibling);
    else return;
  }
  refreshFont();
  refreshSize();
})();
</script>

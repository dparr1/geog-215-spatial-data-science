<!--
  Reading settings, part 1 of 2: applies the reader's saved font and text size
  before the page draws, so it doesn't flash in the default font first.
  The menu itself is in assets/reader-settings.html; styles are in
  assets/reader-settings.css.
-->
<script>
  (function () {
    try {
      var font = localStorage.getItem("sds-reader-font");
      var size = localStorage.getItem("sds-reader-size");
      if (font) document.documentElement.setAttribute("data-reader-font", font);
      // Lexend and Cardo come from Google Fonts, loaded only for readers who pick them.
      var webFonts = {
        lexend: "https://fonts.googleapis.com/css2?family=Lexend:wght@300..700&display=swap",
        cardo: "https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&display=swap"
      };
      if (webFonts[font]) {
        var link = document.createElement("link");
        link.rel = "stylesheet"; link.href = webFonts[font]; link.id = "sds-reader-webfont-" + font;
        document.head.appendChild(link);
      }
      if (size) document.documentElement.setAttribute("data-reader-size", size);
    } catch (e) { /* storage blocked: keep the defaults */ }
  })();
</script>

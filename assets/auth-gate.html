<!--
  GEOG 215 sign-in gate (email + password; no email is ever sent).
  Included in every HTML page's <head> only for geog215.org, by the `geog215`
  profile (_quarto-geog215.yml); daveparr.com/geog215/ has no gate. Database
  setup is in supabase/setup.sql, the first-time sign-up runs in the
  redeem-code Edge Function (supabase/functions/redeem-code), and the
  instructor steps are in supabase/README.md.

  First visit ("First time here?"): the student enters their email, the
  one-time setup code their instructor gave them, and a new password. After
  that they sign in with email + password. Accounts are created already
  confirmed, so Supabase never emails students.

  This hides the page in the browser until an active student signs in. It is a front door, not encryption: the page text is still in
  the HTML that is downloaded.
-->
<style>
  html.sds-locked body > :not(#sds-gate) { visibility: hidden !important; }
  html.sds-locked body { overflow: hidden; }

  #sds-gate {
    position: fixed; inset: 0; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; background: #f4f6f8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #sds-gate[hidden] { display: none; }
  #sds-gate .sds-card {
    width: 100%; max-width: 380px; padding: 28px 24px;
    background: #fff; border: 1px solid #d9dee3; border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06); color: #1f2933;
  }
  #sds-gate h1 { font-size: 1.35rem; margin: 0 0 4px; }
  #sds-gate p { margin: 0 0 16px; font-size: 0.95rem; color: #52606d; }
  #sds-gate label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  #sds-gate input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 12px;
    font-size: 1rem; border: 1px solid #bcc5ce; border-radius: 6px;
  }
  #sds-gate button {
    width: 100%; padding: 10px 12px; font-size: 1rem; font-weight: 600;
    color: #fff; background: #2c5f8a; border: 0; border-radius: 6px; cursor: pointer;
  }
  #sds-gate button:disabled { opacity: 0.6; cursor: wait; }
  #sds-gate .sds-link {
    width: auto; padding: 0; margin-top: 12px; background: none;
    color: #2c5f8a; font-weight: 400; font-size: 0.9rem; text-decoration: underline;
  }
  #sds-gate .sds-msg { min-height: 1.2em; margin: 12px 0 0; font-size: 0.9rem; }
  #sds-gate .sds-msg.sds-error { color: #b42318; }

  #sds-signout {
    position: fixed; right: 12px; bottom: 12px; z-index: 9999;
    padding: 6px 10px; font-size: 0.8rem; color: #52606d;
    background: rgba(255, 255, 255, 0.92); border: 1px solid #d9dee3;
    border-radius: 6px; cursor: pointer;
  }
</style>

<!-- Lock first, so the page never flashes before the check runs. -->
<script>document.documentElement.classList.add("sds-locked");</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>

<script>
(function () {
  "use strict";

  const SUPABASE_URL = "https://liihdtyoqneslfbfgqml.supabase.co";
  // Publishable key: safe to expose in frontend code (access is set by RLS).
  const SUPABASE_KEY = "sb_publishable_HIAkOd2ci4DGcgGMRMj-vQ_Ttu6WFqb";

  const REDEEM_URL = SUPABASE_URL + "/functions/v1/redeem-code";
  const MIN_PASSWORD = 8;

  let sb = null;
  const $ = (id) => document.getElementById(id);

  // "abcd-2345 " -> "ABCD2345"
  const normalizeCode = (raw) => (raw || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const normalizeEmail = (raw) => (raw || "").trim().toLowerCase();

  function buildGate() {
    const gate = document.createElement("div");
    gate.id = "sds-gate";
    gate.innerHTML = `
      <div class="sds-card" role="dialog" aria-labelledby="sds-title">
        <h1 id="sds-title">Spatial Data Science</h1>

        <form id="sds-signin-step">
          <p>GEOG 215 textbook. Sign in with your email and password.</p>
          <label for="sds-email">Email</label>
          <input id="sds-email" type="email" autocomplete="username" spellcheck="false" required>
          <label for="sds-password">Password</label>
          <input id="sds-password" type="password" autocomplete="current-password" required>
          <button type="submit">Sign in</button>
          <button type="button" class="sds-link" id="sds-to-setup">First time here? Set up your password</button>
        </form>

        <form id="sds-setup-step" hidden>
          <p>Enter your email and the setup code from your instructor, then choose a password. After this you'll sign in with your email and password.</p>
          <label for="sds-new-email">Email</label>
          <input id="sds-new-email" type="email" autocomplete="username" spellcheck="false" required>
          <label for="sds-new-code">Setup code</label>
          <input id="sds-new-code" autocomplete="one-time-code" autocapitalize="characters"
                 spellcheck="false" required>
          <label for="sds-new-password">New password (at least ${MIN_PASSWORD} characters)</label>
          <input id="sds-new-password" type="password" autocomplete="new-password"
                 minlength="${MIN_PASSWORD}" maxlength="72" required>
          <label for="sds-new-password2">Type it again</label>
          <input id="sds-new-password2" type="password" autocomplete="new-password"
                 minlength="${MIN_PASSWORD}" maxlength="72" required>
          <button type="submit">Set password and sign in</button>
          <button type="button" class="sds-link" id="sds-to-signin">Already set up? Sign in</button>
        </form>

        <p class="sds-msg" id="sds-msg" role="status"></p>
      </div>`;
    document.body.appendChild(gate);

    $("sds-signin-step").addEventListener("submit", onSignIn);
    $("sds-setup-step").addEventListener("submit", onSetup);
    $("sds-to-setup").addEventListener("click", () => { say(""); showStep("setup"); });
    $("sds-to-signin").addEventListener("click", () => { say(""); showStep("signin"); });
  }

  function showStep(step) {
    $("sds-gate").hidden = false;
    $("sds-signin-step").hidden = step !== "signin";
    $("sds-setup-step").hidden = step !== "setup";
    (step === "signin" ? $("sds-email") : $("sds-new-email")).focus();
  }

  function say(text, isError) {
    const el = $("sds-msg");
    el.textContent = text || "";
    el.classList.toggle("sds-error", !!isError);
  }

  function busy(form, on) {
    form.querySelectorAll("button, input").forEach((el) => (el.disabled = on));
  }

  function displayName(user) {
    const name = user.user_metadata && user.user_metadata.student_name;
    return name || user.email || "";
  }

  function unlock(user) {
    $("sds-gate").hidden = true;
    document.documentElement.classList.remove("sds-locked");
    if (!$("sds-signout")) {
      const btn = document.createElement("button");
      btn.id = "sds-signout";
      btn.type = "button";
      btn.textContent = "Sign out (" + displayName(user) + ")";
      btn.addEventListener("click", async () => {
        await sb.auth.signOut();
        location.reload();
      });
      document.body.appendChild(btn);
    }
    // Progress: note that this student opened this page. Never blocks reading.
    sb.rpc("record_page_visit", { p_page: location.pathname }).then(
      ({ error }) => { if (error) console.warn("Progress not saved:", error.message); },
      () => {}
    );
  }

  // Ask Supabase whether the signed-in user's code is still active.
  async function isApproved() {
    const { data, error } = await sb.rpc("is_current_user_approved");
    if (error) throw error;
    return data === true;
  }

  async function admitOrReject(user) {
    if (await isApproved()) {
      unlock(user);
    } else {
      await sb.auth.signOut();
      showStep("signin");
      say("Your access to this textbook is no longer active. Contact your instructor.", true);
    }
  }

  async function signIn(email, password) {
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) {
      const wrong = /invalid login credentials/i.test(error.message || "");
      say(wrong
        ? "That email and password don't match. If this is your first visit, use \"First time here?\" below."
        : "Couldn't sign in: " + error.message, true);
      return false;
    }
    await admitOrReject(data.user);
    return true;
  }

  async function onSignIn(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const email = normalizeEmail($("sds-email").value);
    if (!email) return;
    busy(form, true);
    say("Signing in…");
    try {
      await signIn(email, $("sds-password").value);
    } catch (e) {
      say("Signed in, but couldn't confirm your access: " + e.message, true);
    }
    busy(form, false);
  }

  async function onSetup(event) {
    event.preventDefault();
    const form = event.currentTarget;
    const email = normalizeEmail($("sds-new-email").value);
    const code = normalizeCode($("sds-new-code").value);
    const password = $("sds-new-password").value;
    if (!email || !code) return;
    if (password.length < MIN_PASSWORD) {
      say("Choose a password of at least " + MIN_PASSWORD + " characters.", true);
      return;
    }
    if (password !== $("sds-new-password2").value) {
      say("The two passwords don't match.", true);
      return;
    }
    busy(form, true);
    say("Setting up…");
    try {
      const res = await fetch(REDEEM_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json", apikey: SUPABASE_KEY },
        body: JSON.stringify({ email, code, password }),
      });
      const body = await res.json().catch(() => ({}));
      if (!res.ok) {
        say(body.error || "Couldn't set up your account (error " + res.status + ").", true);
        busy(form, false);
        return;
      }
      // Pre-fill the sign-in form so a browser can offer to save the password.
      $("sds-email").value = email;
      $("sds-password").value = password;
      if (!(await signIn(email, password))) showStep("signin");
    } catch (e) {
      say("Couldn't reach the sign-up service: " + e.message, true);
    }
    busy(form, false);
  }

  async function init() {
    buildGate();
    if (!window.supabase || !window.supabase.createClient) {
      showStep("signin");
      busy($("sds-signin-step"), true);
      say("Sign-in is unavailable right now (couldn't load Supabase). Try reloading.", true);
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        await admitOrReject(session.user);
      } else {
        showStep("signin");
      }
    } catch (e) {
      showStep("signin");
      say("Couldn't check your sign-in: " + e.message, true);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>

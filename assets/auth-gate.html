<!--
  GEOG 215 sign-in gate (email sign-in: a one-time code or link, no passwords).
  Included in every HTML page's <head> only for geog215.org, by the `geog215`
  profile (_quarto-geog215.yml); daveparr.com/geog215/ has no gate. Database
  setup is in supabase/setup.sql and the instructor steps (Resend, email
  templates) are in supabase/README.md.

  The student enters their email. Supabase emails them (through Resend) a
  6-digit code and a link. They either type the code here, or open the link,
  which brings them back to this page with #token_hash=... and a "Continue"
  button. The button matters: UNC's mail scanner opens every link in an email,
  so the link must not sign anyone in until a person clicks.

  Only emails on the active roster (or the instructor list) can get an
  account; the database refuses anyone else.

  This hides the page in the browser until an active student signs in. It is a
  front door, not encryption: the page text is still in the HTML that is
  downloaded.
-->
<style>
  html.sds-locked body > :not(#sds-gate) { visibility: hidden !important; }
  html.sds-locked body { overflow: hidden; }

  #sds-gate {
    position: fixed; inset: 0; z-index: 10000;
    display: flex; align-items: center; justify-content: center;
    padding: 16px; background: #f4f6f8;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  #sds-gate[hidden] { display: none; }
  #sds-gate .sds-card {
    width: 100%; max-width: 380px; padding: 28px 24px;
    background: #fff; border: 1px solid #d9dee3; border-radius: 10px;
    box-shadow: 0 4px 18px rgba(0, 0, 0, 0.06); color: #1f2933;
  }
  #sds-gate h1 { font-size: 1.35rem; margin: 0 0 4px; }
  #sds-gate p { margin: 0 0 16px; font-size: 0.95rem; color: #52606d; }
  #sds-gate label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
  #sds-gate input {
    width: 100%; box-sizing: border-box; padding: 10px 12px; margin-bottom: 12px;
    font-size: 1rem; border: 1px solid #bcc5ce; border-radius: 6px;
  }
  #sds-gate #sds-code { font-size: 1.3rem; letter-spacing: 0.25em; text-align: center; }
  #sds-gate button {
    width: 100%; padding: 10px 12px; font-size: 1rem; font-weight: 600;
    color: #fff; background: #2c5f8a; border: 0; border-radius: 6px; cursor: pointer;
  }
  #sds-gate button:disabled { opacity: 0.6; cursor: wait; }
  #sds-gate .sds-link {
    display: block; width: auto; padding: 0; margin-top: 12px; background: none;
    color: #2c5f8a; font-weight: 400; font-size: 0.9rem; text-decoration: underline;
  }
  #sds-gate .sds-msg { min-height: 1.2em; margin: 12px 0 0; font-size: 0.9rem; }
  #sds-gate .sds-msg.sds-error { color: #b42318; }

  #sds-signout {
    position: fixed; right: 12px; bottom: 12px; z-index: 9999;
    padding: 6px 10px; font-size: 0.8rem; color: #52606d;
    background: rgba(255, 255, 255, 0.92); border: 1px solid #d9dee3;
    border-radius: 6px; cursor: pointer;
  }
</style>

<!-- Lock first, so the page never flashes before the check runs. -->
<script>document.documentElement.classList.add("sds-locked");</script>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"></script>

<script>
(function () {
  "use strict";

  const SUPABASE_URL = "https://liihdtyoqneslfbfgqml.supabase.co";
  // Publishable key: safe to expose in frontend code (access is set by RLS).
  const SUPABASE_KEY = "sb_publishable_HIAkOd2ci4DGcgGMRMj-vQ_Ttu6WFqb";

  let sb = null;
  let pendingEmail = "";
  const $ = (id) => document.getElementById(id);
  const normalizeEmail = (raw) => (raw || "").trim().toLowerCase();

  // The sign-in link in the email ends in #token_hash=...&type=email (see the
  // email templates in supabase/README.md). Read it, then remove it from the
  // address bar so it isn't bookmarked or shared.
  function takeLinkToken() {
    const params = new URLSearchParams(location.hash.replace(/^#/, ""));
    const tokenHash = params.get("token_hash");
    if (!tokenHash) return null;
    history.replaceState(null, "", location.pathname + location.search);
    return { token_hash: tokenHash, type: params.get("type") || "email" };
  }

  function buildGate() {
    const gate = document.createElement("div");
    gate.id = "sds-gate";
    gate.innerHTML = `
      <div class="sds-card" role="dialog" aria-labelledby="sds-title">
        <h1 id="sds-title">Spatial Data Science</h1>

        <form id="sds-email-step">
          <p>GEOG 215 textbook. Enter your email and we'll send you a sign-in code.</p>
          <label for="sds-email">Email</label>
          <input id="sds-email" type="email" autocomplete="email" spellcheck="false" required>
          <button type="submit">Email me a sign-in code</button>
        </form>

        <form id="sds-code-step" hidden>
          <p id="sds-code-intro"></p>
          <label for="sds-code">Sign-in code</label>
          <input id="sds-code" inputmode="numeric" autocomplete="one-time-code"
                 pattern="[0-9 ]{6,12}" spellcheck="false" required>
          <button type="submit">Sign in</button>
          <button type="button" class="sds-link" id="sds-resend">Send a new code</button>
          <button type="button" class="sds-link" id="sds-change-email">Use a different email</button>
        </form>

        <form id="sds-link-step" hidden>
          <p>Click Continue to finish signing in.</p>
          <button type="submit">Continue</button>
        </form>

        <p class="sds-msg" id="sds-msg" role="status"></p>
      </div>`;
    document.body.appendChild(gate);

    $("sds-email-step").addEventListener("submit", onSendCode);
    $("sds-code-step").addEventListener("submit", onEnterCode);
    $("sds-resend").addEventListener("click", () => sendCode(pendingEmail));
    $("sds-change-email").addEventListener("click", () => { say(""); showStep("email"); });
  }

  function showStep(step) {
    $("sds-gate").hidden = false;
    ["email", "code", "link"].forEach((s) => ($("sds-" + s + "-step").hidden = s !== step));
    const focus = { email: "sds-email", code: "sds-code" }[step];
    if (focus) $(focus).focus();
  }

  function say(text, isError) {
    const el = $("sds-msg");
    el.textContent = text || "";
    el.classList.toggle("sds-error", !!isError);
  }

  function busy(on) {
    $("sds-gate").querySelectorAll("button, input").forEach((el) => (el.disabled = on));
  }

  function displayName(user) {
    const name = user.user_metadata && user.user_metadata.student_name;
    return name || user.email || "";
  }

  function unlock(user) {
    $("sds-gate").hidden = true;
    document.documentElement.classList.remove("sds-locked");
    if (!$("sds-signout")) {
      const btn = document.createElement("button");
      btn.id = "sds-signout";
      btn.type = "button";
      btn.textContent = "Sign out (" + displayName(user) + ")";
      btn.addEventListener("click", async () => {
        await sb.auth.signOut();
        location.reload();
      });
      document.body.appendChild(btn);
    }
    // Progress: note that this student opened this page. Never blocks reading.
    sb.rpc("record_page_visit", { p_page: location.pathname }).then(
      ({ error }) => { if (error) console.warn("Progress not saved:", error.message); },
      () => {}
    );
  }

  // Ask Supabase whether the signed-in user is still an active student.
  async function isApproved() {
    const { data, error } = await sb.rpc("is_current_user_approved");
    if (error) throw error;
    return data === true;
  }

  async function admitOrReject(user) {
    if (await isApproved()) {
      unlock(user);
    } else {
      await sb.auth.signOut();
      showStep("email");
      say("Your access to this textbook is no longer active. Contact your instructor.", true);
    }
  }

  // Email a code + link. The database refuses to create an account for an
  // email that isn't on the roster; that refusal gets the same reply as a
  // success, so this form can't be used to find out who is in the class.
  async function sendCode(email) {
    busy(true);
    say("Sending…");
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { shouldCreateUser: true, emailRedirectTo: location.origin + location.pathname },
    });
    busy(false);
    if (error && !/database error/i.test(error.message || "")) {
      say(error.status === 429
        ? "Too many emails requested. Wait a minute, then try again."
        : "Couldn't send the email: " + error.message, true);
      return;
    }
    pendingEmail = email;
    $("sds-code-intro").textContent =
      "If " + email + " is on the class list, we've emailed it a sign-in code. " +
      "Enter the code below, or open the link in the email.";
    $("sds-code").value = "";
    showStep("code");
    say("No email after a few minutes? Check your junk folder, and that this is the email your instructor has on file.");
  }

  async function onSendCode(event) {
    event.preventDefault();
    const email = normalizeEmail($("sds-email").value);
    if (email) await sendCode(email);
  }

  async function onEnterCode(event) {
    event.preventDefault();
    const token = $("sds-code").value.replace(/\D/g, "");
    if (!token || !pendingEmail) return;
    busy(true);
    say("Signing in…");
    try {
      const { data, error } = await sb.auth.verifyOtp({ email: pendingEmail, token, type: "email" });
      if (error) {
        say("That code didn't work. It may have expired, or a newer one was sent. " +
            "Check it, or send a new code.", true);
      } else {
        say("");
        await admitOrReject(data.user);
      }
    } catch (e) {
      say("Signed in, but couldn't confirm your access: " + e.message, true);
    }
    busy(false);
  }

  function offerLinkSignIn(link) {
    showStep("link");
    $("sds-link-step").addEventListener("submit", async (event) => {
      event.preventDefault();
      busy(true);
      say("Signing in…");
      try {
        const { data, error } = await sb.auth.verifyOtp(link);
        if (error) {
          showStep("email");
          say("That sign-in link has expired or was already used. Enter your email to get a new one.", true);
        } else {
          say("");
          await admitOrReject(data.user);
        }
      } catch (e) {
        say("Signed in, but couldn't confirm your access: " + e.message, true);
      }
      busy(false);
    }, { once: true });
  }

  async function init() {
    const link = takeLinkToken();
    buildGate();
    if (!window.supabase || !window.supabase.createClient) {
      showStep("email");
      busy(true);
      say("Sign-in is unavailable right now (couldn't load Supabase). Try reloading.", true);
      return;
    }
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    try {
      const { data: { session } } = await sb.auth.getSession();
      if (session) {
        await admitOrReject(session.user);
      } else if (link) {
        offerLinkSignIn(link);
      } else {
        showStep("email");
      }
    } catch (e) {
      showStep("email");
      say("Couldn't check your sign-in: " + e.message, true);
    }
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
